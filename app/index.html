 plan:['3 хв: довгі ноти {G4} і {E4}.','4 хв: «G мажорна пентатоніка».','4 хв: «E мінорна пентатоніка».','4 хв: «Імпровізація на мінорній пентатоніці».'],
 home:'Придумай чотиритактову мелодію тільки з нот пентатоніки і внеси її в «Мій репертуар».'},

{id:'4.6', lvl:4, title:'Greensleeves: мінор у 3/4', goal:'Зіграти старовинну мінорну мелодію з фонограмою, зберігаючи погойдування 3/4.',
 theory:[
  '**Мелодія.** Greensleeves відома з XVI століття. Вона в ля мінорі з підвищеним сьомим ступенем {G#4}, тому звучить як гармонічний мінор, який ти вивчав.',
  '**Ритм погойдування.** Майже кожен такт будується як четвертна з крапкою, восьма і четвертна або половинна і четвертна. Це створює плавне коливання, на якому тримається вся мелодія. Не поспішай з восьмою: вона приходить на «і» другої долі.',
  '**Гармонія.** Акорди змінюються щотакту: Am, C, G, Em, Am, F, E. Акорд E на кінці фраз створює напругу, яку знімає повернення до Am. Послухай, як {G#4} в мелодії збігається з цим акордом.',
  '**Аплікатура.** {G#4} грається лівою рукою повністю з лівим мізинцем. Перехід {A4} → {G#4} → {A4} вимагає, щоб мізинець і Л3 ставилися точно разом із Л2. {F5} і {E5} у верхній частині на ролику +1.',
  '**Виконання.** Стиль спокійний, legato, з невеликим diminuendo наприкінці кожної фрази. Фонограма грає в стилі струнних, без ударних, тож пульс тримаєш ти.'],
 callout:'Четвертна з крапкою і восьма: «до-о-о-ба», а не «до-ба».',
 listen:{seq:GREEN, bpm:84, label:'Greensleeves з фонограмою', chords:song('green').chords, style:'classical'},
 ex:[
  {type:'notes', title:'Ноти мелодії', how:'Усі ноти у своєму темпі.', seq:noDur(GREEN), pass:80},
  {type:'rhythm', title:'Перша фраза з фонограмою', how:'Затакт і вісім тактів.', seq:cutSeq(GREEN,25), beats:3, chords:'N:1 Am:3 C:3 G:3 Em:3 Am:3 F:3 E:3 E:3', style:'classical', bpm:72, maxBpm:110, tol:90, artic:'legato', pass:72},
  {type:'rhythm', title:'Уся мелодія з фонограмою', how:'У темпі, legato.', seq:GREEN, beats:3, chords:song('green').chords, style:'classical', bpm:84, maxBpm:120, tol:85, artic:'legato', pass:75}],
 mistakes:['Восьма після четвертної з крапкою звучить на долю пізніше.','Граєш {G4} замість {G#4}, забувши про мізинець.'],
 plan:['3 хв: довгі ноти {A4}, {G#4}, {E5}.','3 хв: «Ноти мелодії».','5 хв: «Перша фраза з фонограмою».','4 хв: «Уся мелодія з фонограмою».'],
 home:'Запиши дубль Greensleeves і перевір у звіті, чи рівна гучність на довгих нотах.'},

{id:'5.5', lvl:5, title:'Фанк: шістнадцяті й синкопи', goal:'Грати короткі ритмічні рифи точно в сітці шістнадцятих під фанкову фонограму.',
 theory:[
  '**Сітка шістнадцятих.** У фанку доля ділиться на чотири: «раз-ка-і-та». Ноти й паузи стоять на будь-якій з цих частин, а весь ефект створюється точністю: різниця в 30 мс відчувається як «не в кишені».',
  '**Коротко і чітко.** Фанкова нота коротка, з чіткою атакою язиком «тат». Тиша між нотами така ж важлива, як ноти. На EWI зупиняй ноту язиком, а не диханням: так пауза точніша.',
  '**Ghost notes і акценти.** Справжній фанковий риф має перепад гучностей: акцентовані ноти і ледь чутні. Почни без ghost notes, з однаковою гучністю, а коли ритм стабільний, додай акценти на синкопах.',
  '**Слухай бочку і хай-хет.** Фонограма грає хай-хет шістнадцятими, це твоя лінійка. Бочка в фанку часто стоїть не на долях, а на «та» перед третьою долею. Кожна нота рифу має збігатися з одним із ударів хай-хета.',
  '**Акорд E7 і мінорна пентатоніка.** Рифи цього уроку побудовані на {E4}, {G4}, {A4}, {B4}, {D5}, тобто на мінорній пентатоніці E, яка звучить характерно «брудно» над домінантовим E7.'],
 callout:'Рахуй «раз-ка-і-та» і грай склад «тат», зупиняючи кожну ноту язиком.',
 listen:{seq:'E4:0.25 r:0.25 E4:0.25 G4:0.25 r:0.5 A4:0.25 r:0.25 B4:0.5 r:0.25 A4:0.25 G4:0.5 E4:0.5', bpm:90, label:'Фанковий риф', chords:'E7:4', style:'funk'},
 ex:[
  {type:'rhythm', title:'Фанковий риф', how:'Чотири такти шістнадцятих.', seq:'E4:0.25 r:0.25 E4:0.25 G4:0.25 r:0.5 A4:0.25 r:0.25 B4:0.5 r:0.25 A4:0.25 G4:0.5 E4:0.5 E4:0.25 r:0.25 E4:0.25 G4:0.25 r:0.5 A4:0.25 r:0.25 B4:0.5 r:0.25 A4:0.25 G4:0.5 E4:0.5 E4:0.25 r:0.25 E4:0.25 G4:0.25 r:0.5 A4:0.25 r:0.25 B4:0.5 D5:0.5 B4:0.5 r:0.5 E5:1 D5:0.5 B4:0.5 r:2', chords:'E7:4 E7:4 E7:4 E7:4', style:'funk', bpm:84, maxBpm:110, tol:45, pass:70},
  {type:'rhythm', title:'Синкопи шістнадцятими', how:'Ноти на «та» перед долею.', seq:'r:0.75 B4:0.25 r:0.5 B4:0.5 A4:0.25 G4:0.25 r:0.5 E4:1 r:0.75 B4:0.25 r:0.5 B4:0.5 A4:0.25 G4:0.25 r:0.5 E4:1 r:0.75 D5:0.25 r:0.5 D5:0.5 B4:0.25 A4:0.25 r:0.5 G4:1 E4:4', chords:'Em7:4 Em7:4 Em7:4 Em7:4', style:'funk', bpm:84, maxBpm:110, tol:45, pass:70}],
 mistakes:['Ноти задовгі: риф перетворюється на legato і втрачає енергію.','Паузи коротшають, і риф прискорюється.'],
 plan:['3 хв: одна нота {E4} шістнадцятими під метроном 70 bpm, кожна зупинена язиком.','6 хв: «Фанковий риф».','6 хв: «Синкопи шістнадцятими».'],
 home:'Придумай власний однотактовий риф на тих самих п\'яти нотах і зіграй його чотири рази поспіль під фанкову фонограму в «Мій репертуар».'},

{id:'6.5', lvl:6, title:'Довгі лінії: Канон Пахельбеля', goal:'Вести повільну мелодію з бездоганним диханням, legato і пізнім вібрато.',
 theory:[
  '**Найважче повільно.** У швидкому пасажі нерівність ховається, у повільних половинних нотах чутно все: кожну хвилю тиску, кожен проміжний звук між нотами, кожен запізнілий перехід. Тому Канон це тест на майстерність, а не вправа для початківців, хоча нот у ньому мало.',
  '**Гармонія канону.** Під мелодією безперервно повторюється вісім акордів: D, A, Bm, F♯m, G, D, G, A. Мелодія спускається по звуках цих акордів: {F#5} над D, {E5} над A, {D5} над Bm і так далі. Почуй, як кожна нота мелодії «сідає» на свій акорд.',
  '**Дихання на довгу лінію.** Вісім половинних нот при 60 bpm займають 16 секунд. Плануй вдихи заздалегідь: короткий вдих через ніс після кожних чотирьох нот, не перериваючи legato більше ніж на мить.',
  '**Переходи legato.** Між повільними нотами пальці мають змінюватися ідеально синхронно. У {D5} → {C#5} піднімаються всі шість пальців одночасно, а великий палець лишається на ролику. Це найнебезпечніший перехід.',
  '**Вібрато як фарба.** Перша половина кожної ноти рівна, у другій з\'являється неглибоке вібрато 5 Гц. Так звучать скрипки в класичних записах, і на EWI цей прийом дає мелодії «спів».'],
 callout:'Перехід {D5} → {C#5}: усі шість пальців піднімаються одночасно.',
 listen:{seq:CANON, bpm:60, label:'Канон з фонограмою', chords:song('canon').chords, style:'classical', vibrato:true},

  {type:'long', title:'Довгі ноти теми', how:'Кожна нота 6 секунд у вузькій смузі.', seq:'F#5 E5 D5 C#5', hold:6, band:[55,85], pass:75},
  {type:'rhythm', title:'Канон повільно', how:'Темп 52, legato.', seq:CANON, chords:song('canon').chords, style:'classical', bpm:52, maxBpm:80, tol:90, artic:'legato', pass:78},
  {type:'rhythm', title:'Канон у темпі', how:'Темп 66, legato без провалів.', seq:CANON, chords:song('canon').chords, style:'classical', bpm:66, maxBpm:90, tol:80, artic:'legato', pass:82}],

 home:'Запиши Канон з пізнім вібрато і порівняй у «Записах» середній строй і динамічний діапазон з попереднім дублем.'},

{id:'6.6', lvl:6, title:'Транспонування', goal:'Грати знайому мелодію в будь-якій тональності, думаючи ступенями, а не нотами.',
 theory:[
  '**Навіщо.** Співак просить заграти на тон нижче, ансамбль грає в незручній тональності, улюблене соло записане для іншого інструмента. Професіонал переносить мелодію в будь-яку тональність на ходу.',
  '**Думай ступенями.** «Ода до радості» в G мажорі починається з третього ступеня ({B4}). У D мажорі третій ступінь {F#4}, у F мажорі {A4}, у B♭ мажорі {D5}. Якщо пам\'ятаєш мелодію як послідовність ступенів 3-3-4-5-5-4-3-2-1-1-2-3, її можна заграти від будь-якої тоніки.',

 theory:[
  '**Рахунок «і».** Восьмі на «і» лежать рівно посередині між клацаннями. Якщо рахувати вголос «раз-і-два-і», ці ноти стають на свої місця самі. Без рахунку восьмі зазвичай «зсуваються» до наступної долі.',
  '**Пауза як нота.** Пауза має точну тривалість і так само рахується. На EWI паузу роблять припиненням видиху або язиком. Язиком точніше: звук зупиняється миттєво, а дихання можна лишити готовим до наступної ноти.',
  '**Ритм четвертна з крапкою плюс восьма.** Це «довга-коротка» пара на дві долі. Восьма після крапки звучить на «і» другої долі. Типова помилка: грати її на саму долю, тобто як дві рівні четвертні.',
  '**Проплескування.** Перед новою ритмічною вправою проплескай ритм долонями під метроном. Ритм, який ти можеш проплескати, ти зможеш і зіграти: пальці вже не відволікатимуть від рахунку.'],
 plan:['3 хв: довгі ноти.','4 хв: проплескати ритм усіх трьох вправ під метроном 66 bpm.','4 хв: «Восьмі» і «Четвертна з крапкою» з підказкою, потім без неї.','4 хв: «Паузи», зупиняй кожну ноту язиком.'],
 mistakes:['Восьма після четвертної з крапкою звучить запізно, впритул до наступної долі.']},
'2.3':{
 theory:[
  '**Як EWI бачить атаку.** Нота починається, коли тиск у мундштуку перевищує поріг. Язик на мить перекриває потік, тиск падає, і наступний видих дає нову атаку. Тому на EWI атака язиком працює так само природно, як на саксофоні.',
  '**Тверда й м\'яка атака.** «Ту» дає чіткий старт і підходить для ритмічних фраз. «Ду» м\'якша, вона для лірики і для швидкої гри. Атака з одного дихання, без язика (так звана «хххху»), на EWI звучить розмито, її використовують лише як ефект.',
  '**Legato.** Ти не перестаєш дути, а змінюєш тільки пальці. Для EWI це найпростіший і найчистіший спосіб зв\'язати ноти, але він вимагає ідеальної синхронності пальців, бо кожна проміжна нота буде почута.',
  '**Як застосунок оцінює артикуляцію.** У legato він перевіряє, що між нотами немає провалу дихання, у staccato, що нота займає не більше двох третин тривалості і далі є тиша.'],
 plan:['3 хв: довгі ноти.','4 хв: одна нота {G4} чотирма атаками «ту» на 66 bpm, потім «ду».','4 хв: вправа «Legato».','4 хв: вправа «Staccato».'],
 mistakes:['Зупиняєш staccato диханням замість язика: між нотами тиша, але кожна нота починається з затримкою.','В legato ледь помітно «підштовхуєш» повітря на кожній ноті: на графіку дихання видно зубці.']},
'2.4':{
 theory:[
  '**Структура мелодії.** Тема має дві фрази по чотири такти. Вони починаються однаково, а закінчуються по-різному: перша на {A4} (незавершено, як питання), друга на {G4} (завершено, як відповідь). Почуй цю різницю і зіграй першу фразу з легким підйомом наприкінці, а другу спокійно.',
  '**Ритм кінця фраз.** {B4} з крапкою і {A4} восьмою наприкінці першої фрази дають характерне «затримання». Поширена помилка: зіграти дві рівні четвертні.',
  '**Як вчити мелодію.** Спочатку тільки ноти у своєму темпі, поки не підуть з першої спроби. Потім з метрономом на 72 bpm зі звуком-підказкою. Далі без підказки. І лише після заліку вмикай «авто-темп» і піднімайся до 100 bpm.',
  '**Дихання.** Вдих береться на довгій половинній в кінці кожної фрази. Між фразами в нотах немає паузи, тому вдих короткий, за рахунок частини половинної.'],
 plan:['3 хв: довгі ноти {B4} і {D5}.','5 хв: «Ноти у своєму темпі» до заліку.','7 хв: «Ода з метрономом»: двічі з підказкою, потім без неї.','2 хв: запиши дубль кнопкою «Запис» і послухай його.'],
 mistakes:['Береш вдих посеред фрази і рвеш мелодію.']},
'3.1':{
 theory:[
  '**Півтон і тон.** Півтон це найменша відстань між нотами, наприклад {E4} → {F4} або {B4} → {C5}. Тон це два півтони. Дієз піднімає ноту на півтон, бемоль опускає. Одна й та сама клавіша може мати дві назви: F♯ і G♭ звучать однаково, це енгармонізм.',
  '**Різниця в одну клавішу.** {F4} і {F#4} відрізняються лише тим, який палець правої руки стоїть: П1 чи П2. {A4} і {Bb4}: у B♭ замість Л2 стоїть П1. Через це хроматика тренує саме точність, а не швидкість.',
  '**Мізинці.** Лівий мізинець ставиться на G♯ разом з трьома пальцями лівої руки, правий мізинець на E♭ разом з шістьма пальцями. Мізинцеві клавіші дальше від центру, тому мізинець тримай над ними наготові, а не прибраним.',
  '**C♯ відкрита.** Для {C#5} всі клавіші відпущені. Через це вона звучить, якщо всі пальці випадково піднялися, і часто з\'являється як «зайва нота». Застосунок це покаже.'],
 plan:['3 хв: довгі ноти {F#4} і {Bb4}.','5 хв: «Знайомство», кожну нову ноту зіграй окремо 5 разів.','5 хв: «Хроматика» вгору і вниз без метронома.','4 хв: «Хроматика в ритмі» на 60 bpm, потім 66.'],
 mistakes:['Плутаєш {F4} і {F#4}: перевір, П1 чи П2 стоїть.','Граєш {Bb4} як «A з П1», не знімаючи Л2: звучить зовсім інша нота.']},
'3.2':{
 theory:[
  '**Ступені гами.** Кожна нота гами має номер, ступінь. Перший ступінь (тоніка) дає центр тяжіння, п\'ятий (домінанта) тягне до тоніки, сьомий (вводний тон) стоїть на півтон нижче тоніки і тягнеться до неї.',
  '**Знаки при ключі.** Тональність G мажор має {F#4}, тому кожне F у творі в G мажорі грається як F♯, навіть якщо знака біля ноти немає. Це головне, що треба тримати в голові при читанні нот.',
  '**Як грати гами.** Рівно, legato, без акценту на верхній ноті. Найпоширеніша помилка: прискорення на висхідній частині і сповільнення на низхідній. Метроном це одразу видає.',
  '**Межа регістрів у гамах.** G мажор переходить ролик між {C5} і {D5}, F мажор теж, C мажор у верхній октаві між {C#5} і {D5} на самому початку. Це місця, де найчастіше виникають зайві ноти.'],
 plan:['3 хв: довгі ноти на тоніках {G4}, {F4}, {C5}.','5 хв: G мажор з підказкою, потім без.','5 хв: F мажор.','4 хв: C мажор і авто-темп на тій гамі, що йде найлегше.'],
 mistakes:['Граєш F натуральне в гамі G мажор за звичкою з попереднього уроку.']},
'3.3':{
 theory:[
  '**Діапазон датчика.** Датчик дихання передає значення від 0 до 127. Поріг звучання зазвичай близько 10–20, тихий звук 25–45, mf 55–75, гучний 90 і вище. Якщо гучний звук у тебе виходить лише з великою напругою, збільш чутливість дихання в меню EWI Solo.',
  '**Як читати графік.** Пунктир показує цільову криву: у crescendo пряма знизу вгору, у diminuendo навпаки, «хвиля» піднімається до середини і спадає. Твоя лінія має йти поруч з пунктиром рівномірно, без сходинок.',
  '**Динаміка в мелодії.** Динамічні позначки відносні. Forte в баладі тихіше, ніж forte в рок-партії. Головне не абсолютний рівень, а контраст і плавність переходів.',
  '**Тиск і тембр.** На багатьох пресетах дихання відкриває фільтр, тому crescendo робить звук не лише гучнішим, але й яскравішим. В «Аналізаторі звуку» це видно по показнику яскравості.'],
 plan:['3 хв: довгі ноти на трьох рівнях: p, mf, f, по одній на кожен.','4 хв: «Crescendo» і «Diminuendo».','4 хв: «Хвиля».','4 хв: «Сходинки», чотири рівні з чіткою межею.'],
 mistakes:['Різко «відкриваєш» звук на останній долі crescendo.','Diminuendo закінчується обривом звуку, а не тихою нотою.']},
'3.4':{
 theory:[
  '**Затакт.** Мелодія починається не з першої долі, а з неповного такту. Перша нота {D4} звучить на третю, слабку долю і веде до сильної першої долі наступного такту. Рахуй «раз-два» мовчки і на «три» вступай.',
  '**Акцент у 3/4.** Перша доля сильна, дві інші легкі. У повільному вальсовому русі на першу долю ледь спирайся диханням, тоді мелодія «гойдається».',
  '**Великі стрибки.** {D4} → {G4} і {D4} → {B4} вимагають знімати пальці правої руки одночасно. Повтори ці переходи окремо по 10 разів, поки не зникнуть проміжні ноти.',
  '**Балада і дихання.** Тут довгі ноти по 2–3 долі, тож тренуй рівний тиск до кінця кожної. Добре виконання балади вирішується саме на довгих нотах.'],
 plan:['3 хв: довгі ноти {D4}, {G4}, {D5}.','5 хв: «Ноти у своєму темпі».','2 хв: переходи {D4} → {G4} і {D4} → {B4} по 10 разів.','5 хв: «Amazing Grace у 3/4» з підказкою, потім без і з записом дубля.'],
 mistakes:['Вступаєш на першу долю замість третьої: вся мелодія зсувається на дві долі.']},
'4.1':{
 theory:[
  '**Паралельні тональності.** Кожна мажорна тональність має мінорну пару з тими самими знаками: G мажор і E мінор, C мажор і A мінор, F мажор і D мінор. Тоніка мінору на малу терцію нижче тоніки мажору.',
  '**Три мінори.** Натуральний мінор звучить м\'яко й сумно. Гармонічний з підвищеним сьомим ступенем дає сильне тяжіння до тоніки, ним часто закінчують мелодії. Мелодичний (в джазі) має підвищені шостий і сьомий ступені.',
  '**Лади як кольори.** Дорійський лад звучить «світліше» за натуральний мінор і використовується в джазі, фанку та соулі. Міксолідійський (мажор зі зниженим сьомим ступенем) є основою блюзу і рок-н-ролу. Усі лади граються тими самими пальцями, що й мажорні гами, змінюється лише точка опори.',
  '**Слухай, а не тільки грай.** Після кожної гами зіграй тоніку довгою нотою і послухай, як гама «приходить додому». Так лад запам\'ятовується на слух, а не тільки пальцями.'],
 plan:['3 хв: довгі ноти {E4} і {D4}.','4 хв: «E натуральний мінор».','4 хв: «E гармонічний мінор», окремо повтори перехід {C5} → {D#5}.','4 хв: «D дорійський» і послухай різницю з D мінором.'],
 mistakes:['Граєш {D5} замість {D#5} у гармонічному мінорі за звичкою з G мажору.']},
'4.2':{
 theory:[
  '**Інтервали через пісні.** Кожен інтервал легше впізнавати за знайомою мелодією, яка з нього починається. Складіть собі власний список: одна пісня на кожен інтервал вгору і вниз. Головне, щоб пісні були твої, тоді спогад спрацьовує миттєво.',
  '**Порядок на слух.** Спочатку визнач, куди рухається мелодія (вгору, вниз, стоїть), потім чи це крок (секунда) або стрибок, і лише потім точний інтервал. Помилка на крок легко виправляється, помилка напрямку означає, що фразу треба ще раз послухати.',
  '**Як працює вправа.** Застосунок грає фразу, ти повторюєш. Оцінка рахується за схожістю послідовності нот, тож одна пропущена нота знімає частину балів, а не всю спробу. Кнопкою «Програти ще раз» можна переслухати поточну фразу.',
  '**Співай.** Найкращий місток між слухом і пальцями це голос. Якщо можеш заспівати фразу, зіграти її вдасться з першої-другої спроби.'],
 plan:['3 хв: довгі ноти.','5 хв: «Короткі фрази», перед кожною відповіддю заспівай фразу про себе.','5 хв: «Ширші стрибки».','2 хв: зіграй на слух будь-яку знайому мелодію від {G4}.'],
 mistakes:['Починаєш грати одразу після прослуховування, не визначивши першу ноту.']},
'4.3':{
 theory:[
  '**Звідки береться вібрато на EWI.** Датчик прикусу в мундштуку реагує на легкий тиск зубами чи губами. У стандартних налаштуваннях він модулює висоту. Яку саме функцію має прикус і з якою глибиною, залежить від налаштувань EWI Solo, тому перевір у меню або мануалі, що bite увімкнено і призначено на вібрато.',
  '**Тренування ритму вібрато.** Почни з чітко керованого вібрато під метроном: на 60 bpm по дві хвилі на долю, потім три, потім чотири. Чотири хвилі на долю при 80 bpm дають приблизно 5,3 Гц, це класична саксофонна частота.',
  '**Глибина.** Ціль на цьому уроці від 12 до 45 центів. Менше майже не чути, більше звучить як «пливучий» звук. В «Аналізаторі звуку» на графіку висоти вібрато видно як рівну синусоїду навколо центральної лінії.',
  '**Вібрато як прикраса.** Сучасні саксофоністи вмикають вібрато не одразу, а в другій половині довгої ноти. Зіграй ноту рівно дві долі і лише потім додай хвилю. Це звучить природно і виразно.'],
 plan:['3 хв: довгі ноти без вібрато.','4 хв: вібрато під метроном 60 bpm: дві, потім три, потім чотири хвилі на долю.','4 хв: «Повільне вібрато».','4 хв: «Точне вібрато», потім пізнє вібрато на довгих нотах гами G мажор.'],
 mistakes:['Робиш вібрато диханням замість прикусу: на графіку дихання з\'являються хвилі, а висота не змінюється.','Закушуєш мундштук постійно: вся нота звучить нижче.']},
'4.4':{
 theory:[
  '**Тріольна основа свінгу.** Розділи долю на три рівні частини: «ра-ке-та». Свінгова пара восьмих бере «ра-ке» на першу восьму і «та» на другу. Застосунок очікує другу восьму на 2/3 долі.',
  '**Темп і свінг.** На повільних темпах свінг ближчий до тріолі, на дуже швидких (понад 220 bpm) восьмі майже рівні. Тому вправи цього уроку в середньому темпі, де свінг виражений найкраще.',
  '**Артикуляція в свінгу.** Типовий джазовий підхід: друга восьма злегка акцентована, перша м\'яко. Склади «ду-ба ду-ба» з м\'якою атакою природно дають цю фразу.',
  '**Слухання.** Свінг неможливо засвоїти лише з нот. Слухай записи джазових саксофоністів і підспівуй їхні фрази, звертаючи увагу саме на нерівність восьмих.'],
 plan:['3 хв: довгі ноти.','3 хв: проговорюй «ду-ба ду-ба» під метроном 100 bpm.','5 хв: «Свінгові восьмі» з підказкою, потім без.','4 хв: «Блюзова фраза».'],
 mistakes:['Граєш свінгові восьмі як пунктир (3:1): звучить як марш, а не як свінг.']},
'5.1':{
 theory:[
  '**Звідки блюзова гама.** Це мінорна пентатоніка (1, ♭3, 4, 5, ♭7) з доданою «блюзовою нотою» ♭5. Від G: {G4}, {Bb4}, {C5}, {D5}, {F5} плюс {C#5}. Її звучання впізнається з перших нот у блюзі, року, соулі, джазі.',
  '**Блюзова нота.** {C#5} звучить напружено. Її рідко тримають, зазвичай проходять між {C5} і {D5} або підтягують у {D5}. Спробуй фразу {C5} → {C#5} → {D5} повільно і почуєш характерне «скиглення».',
  '**12-тактова форма.** Вона повторюється по колу, і всі музиканти знають, де вони в ній знаходяться. Вчись відчувати момент переходу на C7 (5-й такт) і на D7 (9-й такт): саме там твоє соло має «помітити» зміну гармонії.',
  '**Мотивна робота.** Не грай нескінченний потік нот. Візьми короткий мотив з 3–4 нот, зіграй його, повтори з іншим ритмом, перенеси вище, закінчи іншою нотою. Так будує соло більшість великих імпровізаторів.'],
 plan:['3 хв: довгі ноти на {G4}, {Bb4}, {D5}.','4 хв: «Блюзова гама» з авто-темпом.','4 хв: «Імпровізація над дроном» із 2–3 мотивами.','4 хв: «12-тактовий блюз».'],

'5.2':{

  '**Септакорди в джазі.** Джазова гармонія майже вся побудована на септакордах. Maj7 звучить м\'яко і світло, m7 тепло, домінантовий 7 напружено і вимагає розв\'язання. Почуй різницю, граючи арпеджіо повільно з довгою останньою нотою.',
  '**Аплікатура арпеджіо.** В арпеджіо пальці переміщуються не по одному, а групами, тому синхронність ще важливіша, ніж у гамах. Проміжні ноти тут звучать особливо помітно.',

'5.3':{
 theory:[

  '**Групування.** Швидкі пасажі думаються не нотами, а групами по 4. Мозок контролює початок кожної групи, а не кожну ноту. Акцентуй першу ноту групи ледь помітно, і пасаж вирівнюється.',
  '**Розслабленість.** На EWI клавіші не мають ходу, тому сила натиску не дає нічого, крім напруги. Перед кожною спробою струсни руки і перевір плечі.',
  '**Ритмічні варіанти.** Швидкий пасаж корисно вчити в ритмі «довга-коротка» і «коротка-довга». Коли повертаєшся до рівних шістнадцятих, вони стають значно рівнішими.'],

'5.4':{
 theory:[
  '**Що таке тембр технічно.** Звук складається з основного тону і обертонів. Чим більше енергії у високих обертонах, тим яскравіший звук. Показник «яскравість» в аналізаторі це спектральний центроїд: середня частота, зважена за енергією.',
  '**Пресет і ти.** Пресет EWI задає базовий тембр, але виразність залежить від дихання. Спробуй зіграти одну ноту на трьох рівнях дихання і подивись, як змінюється яскравість. Деякі пресети майже не змінюють тембр, інші змінюють дуже сильно.',
  '**Підключення для аналізу.** Точний аналіз дає прямий сигнал: навушниковий вихід EWI Solo в аудіовхід ноутбука або USB-аудіоінтерфейс. Тоді обери цей вхід в «Аналізаторі звуку». Мікрофон ноутбука теж працює, але кімнатна акустика змінює спектр.',
  '**Тиха гра.** Справжній контроль видно на тихих нотах. На рівні 25–45 тиск найлегше розхитати, а будь-яка нерівність чутна як «тремтіння» звуку.'],
 plan:['3 хв: в «Аналізаторі звуку» зіграй {G4} на трьох рівнях і запиши, як змінюється яскравість.','4 хв: «Тихі довгі ноти».','4 хв: «Сходинки».','4 хв: «Довга хвиля», потім запис дубля довгих нот.'],

'6.1':{
 theory:[
  '**Вершина фрази.** У кожній фразі є нота, до якої все веде. Зазвичай це найвища або найдовша нота, або нота на сильній долі ближче до кінця. Знайди її в кожній фразі і веди до неї дихання.',
  '**Артикуляційні схеми.** Джазова класика: legato на дві ноти, язик на третю, і так по колу, з акцентом на слабкій восьмій. Для фанку навпаки, короткі різкі ноти з чіткими паузами. Одна й та сама послідовність нот звучить як різна музика залежно від артикуляції.',
  '**Ghost note.** Ледь чутна нота на мінімальному тиску, часто між двома акцентованими. На EWI її робиш, ледь торкаючись порогу датчика. Без ghost notes джазова фраза звучить «квадратно».',
  '**Кінець фрази.** Останню ноту фрази не обривають і не тримають на повній гучності до останньої миті. Вона завершується діминуендо або чітким язиковим стопом, залежно від стилю.'],

'6.2':{
 theory:[
  '**Навіщо транскрибувати.** Записуючи чужі соло, ти переносиш у свою гру не лише ноти, а й фразування, ритм, артикуляцію і логіку побудови. Так вчилися всі великі джазові музиканти.',
  '**Робочий процес.** Знайди коротку фразу (2–4 такти). Слухай, поки не можеш її заспівати. Знайди першу ноту на EWI. Далі нота за нотою, перевіряючи слухом. Ритм записуй окремо, коли ноти вже відомі. Внеси результат у «Мій репертуар» і тренуй як вправу.',
  '**Сповільнення.** Для швидких фраз використовуй будь-який плеєр зі сповільненням без зміни висоти. На 70% швидкості більшість фраз уже розбірливі.',
  '**Авторські права.** Записи, які ти розбираєш, захищені. Транскрипції для власного навчання це звичайна практика; публікувати чужі соло без дозволу не можна.'],
 plan:['3 хв: довгі ноти.','5 хв: «Довгі фрази».','7 хв: транскрипція 2 тактів з улюбленого запису і внесення в «Мій репертуар».'],

'6.3':{
 theory:[
  '**Функції акордів.** Am7 (ІІ) створює рух, D7 (V) напругу, Gmaj7 (I) розв\'язання. Цей ланцюжок звучить у тисячах джазових стандартів, часто кілька разів за п\'єсу в різних тональностях.',
  '**Направляючі тони.** Терції й септими визначають характер акорду. Якщо зіграти лише їх, гармонію вже чути без жодного акомпанементу. Лінія {C5} → {B4} (септима D7 у терцію Gmaj7) і є серцем розв\'язання.',
  '**Наближення (approach notes).** Звук акорду на сильній долі можна підготувати нотою на півтон нижче або вище на слабкій. Це головний прийом бібоп-мови: хроматична нота «підходить» до звуку акорду.',

 plan:['3 хв: довгі ноти на направляючих тонах.','4 хв: «Направляючі тони».','4 хв: арпеджіо Am7, D7, Gmaj7 з попереднього рівня як розминка.','4 хв: «Імпровізація II–V–I».'],
 mistakes:['Граєш G мажорну гаму без уваги до акордів: усі ноти «правильні», але гармонію не чути.']},
'6.4':{
 theory:[
  '**Стабільність замість максимуму.** На виступі ти граєш не найкращий свій дубль, а середній. Тому мета не один ідеальний прохід, а три поспіль вище прохідного балу. Саме це вимагає вправа цього уроку.',
  '**Підготовка твору.** Розбий твір на частини по 4–8 тактів. Важкі місця вчи окремо в повільному темпі, потім з\'єднуй частини попарно, і лише потім грай повністю. Перед виступом останній тиждень грай твір лише повністю, без зупинок.',

// ---------- Прогрес уроків ----------
const lp = id => Progress.lessons[id] || (Progress.lessons[id] = {best:{}});
function lessonDone(l){ const p = lp(l.id); return l.ex.every((e,i)=>(p.best[i]||0) >= passOf(e)); }
function nextLesson(){ return LESSONS.find(l=>!lessonDone(l)); }
function recordResult(l, i, res){
  const p = lp(l.id); p.best[i] = Math.max(p.best[i]||0, Math.round(res.score)); p.last = Date.now();
  Progress.log.unshift({at:Date.now(), lesson:l.id, ex:l.ex[i].title, score:Math.round(res.score), bpm:res.bpm||null});
  Progress.log = Progress.log.slice(0,300); saveProgress();
}

function midiToSeq(track, div, q, fromZero){
  const mono = []; track.notes.forEach(nn=>{ const last = mono[mono.length-1]; if(last && nn.s===last.s) return; if(last && nn.s < last.e) last.e = nn.s; mono.push({...nn}); });

    const nx = mono[i+1] ? Q(mono[i+1].s) : e; const dur = Math.min(e, Math.max(nx, s+q)) - s;
    out.push(nameOf(nn.n+shift).replace('♯','#').replace('♭','b')+':'+(+dur.toFixed(3))); cur = s+dur; });

    if(m.ok){ const rt = (d.t - shownAt)/1000; res.push({n:cur.n, rt, tries}); i++; setHint(null); $('rdT').textContent = `${rt.toFixed(2)} с`; next(); }

    ex:{type:'long', title:'Довгі ноти', how:'Кожна нота 4 секунди, лінія дихання в смузі.', seq:'G4 D4 D5', hold:4, band:[50,90], pass:70}});
  const weak = Object.entries(Progress.wrong||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k])=>k.replace('♯','#').replace('♭','b'));
  if(weak.length){ const seq = weak.flatMap(w=>{ const m = parseNote(w).midi, nb = m >= 67 ? 'G4' : 'D4'; return [w, nb, w, w]; });
    steps.push({title:'Повторення проблемних нот', min:3, why:'Ноти, на яких ти найчастіше помиляєшся: '+weak.map(w=>withKeys(parseNote(w).midi)).join(', ')+'.',
      ex:{type:'notes', title:'Проблемні ноти', how:'Кожну проблемну ноту чергуєш з опорною.', seq:seq.join(' '), pass:85}}); }
  else steps.push({title:'Хроматика', min:3, why:'Помилок поки мало, тож тренуємо всі півтони.', ex:{type:'notes', title:'Хроматична гама', how:'Вгору і вниз.', seq:'D4 Eb4 E4 F4 F#4 G4 G#4 A4 Bb4 B4 C5 C#5 D5 C#5 C5 B4 Bb4 A4 G#4 G4 F#4 F4 E4 Eb4 D4', pass:80}});
  const tw = transStats(5).filter(r=>r.rate > 0.1)[0];
  if(tw) steps.push({title:`Перехід ${pcName(tw.a)} → ${pcName(tw.b)}`, min:2, why:`На цьому переході ${Math.round(tw.rate*100)}% разів проскакує проміжна нота: ${transTip(tw.a, tw.b)}.`, ex:transDrill(tw.a, tw.b)});
  const done = LESSONS.filter(lessonDone).length;
  steps.push({title:'Читання нот', min:3, why:'Швидкість реакції: бачиш ноту — граєш.', reading:{range: done < 8 ? 'base' : done < 20 ? 'two' : 'wide', acc: done >= 10, count:12, hint:true}});
  const l = nextLesson();
  if(l){ const p = lp(l.id), i = l.ex.findIndex((e,k)=>(p.best[k]||0) < passOf(e));
    if(i >= 0) steps.push({title:`Урок ${l.id}: ${l.ex[i].title}`, min:6, why:`Наступна непройдена вправа уроку «${l.title}».`, ex:l.ex[i], lesson:l, idx:i}); }
  const reps = LS.get('songs', []);
  const rep = reps.map(s=>({s, h:Object.values((Progress.heat||{})['song.'+s.id]||{}).map(x=>x[0])})).filter(x=>x.h.length).sort((a,b)=>Math.min(...a.h)-Math.min(...b.h))[0];
  if(rep){ const s = rep.s, h = (Progress.heat||{})['song.'+s.id]; let wi = 0, wv = 2; Object.entries(h).forEach(([k,v])=>{ if(v[0] < wv){ wv = v[0]; wi = +k; } });
    LS.set('sec.song.'+s.id, Object.assign({}, LS.get('sec.song.'+s.id, {}), {a:wi+1, b:wi+2, loop:true}));
    steps.push({title:`Репертуар: «${s.title}», такти ${wi+1}–${wi+2}`, min:5, why:'Найслабше місце в мелодії з твого репертуару, у петлі зі сходинками темпу.',
      ex:{type:'rhythm', title:s.title, how:'Петля на слабких тактах. Темп підніметься після кожного чистого проходу.', seq:s.seq, bpm:Math.round(s.bpm*0.8), beats:s.beats, maxBpm:s.bpm, key:'song.'+s.id, tol:85, chords:s.chords, style:s.style, tracks:s.tracks, muted:s.muted, allowLoop:true, pass:80}}); }
  else { const sg = SONGS.filter(songUnlocked).find(x=>!(songBest(x.id).play && songBest(x.id).play.score >= 75));
    if(sg) steps.push({title:`Мелодія: ${sg.title}`, min:5, why:'Відкрита мелодія, яку ти ще не зіграв на прохідний бал.',
      ex:{type:'rhythm', title:sg.title, how:'З фонограмою.', seq:sg.seq, beats:sg.beats, den:sg.den, bpm:Math.round(sg.bpm*0.85), maxBpm:sg.maxBpm, tol:85, chords:sg.chords, style:sg.style, key:'songs.'+sg.id, pass:75, allowLoop:true}, song:sg}); }
  return steps;
}
function viewDaily(v){

        if(s.song) saveSongBest(s.song.id, 'play', res.score, res.bpm); },

    else stop = RUNNERS[s.ex.type]($('dBox'), s.ex, ctx); };
  function finish(){ const min = Math.round((now()-t0)/60000); Progress.daily = Progress.daily || {}; Progress.daily[today()] = {min, steps:steps.length, done:results.filter(x=>x!=null).length}; saveProgress(); checkBadges();
    $('dWhy').textContent = ''; $('dBox').innerHTML = `<div class="result pass"><div><span class="score">Готово</span><span class="muted"> · ${min} хв</span></div>
      <table class="fing">${steps.map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${results[i]!=null?results[i]:'пропущено'}</td></tr>`).join('')}</table>
      <textarea class="report" id="dJ" style="min-height:60px;margin-top:10px" placeholder="Нотатка до заняття: що вийшло, що заважало…"></textarea>
      <div class="row" style="margin-top:8px"><button class="primary" id="dT">Розбір з вчителем</button><button id="dP">До програми</button></div></div>`;
    const saveJ = () => { const tx = $('dJ') && $('dJ').value.trim(); if(tx){ journalAdd(tx); $('dJ').value = ''; } };
    $('dT').onclick = ()=>{ saveJ(); go('teacher'); }; $('dP').onclick = ()=>{ saveJ(); go('program'); }; }
  $('dSkip').onclick = () => step(k+1);
  step(0);
  UI.cleanup = () => { if(stop) stop(); clearInterval(clock); };
}

    (()=>{ const tr = typeof transStats==='function' ? transStats(5).filter(r=>r.rate>0.1).slice(0,5) : []; return tr.length ? 'Переходи з проміжними нотами: '+tr.map(r=>`${pcName(r.a)}→${pcName(r.b)} ${Math.round(r.rate*100)}%`).join(', ')+'.' : ''; })(),

${buildReport()}${(()=>{ const prev = TeacherLog.get().slice(0,3); return prev.length ? '\n\nТвої попередні поради цьому учневі (від нових до старих). Звір зі звітом, що з них виконано, і скажи про це одним-двома реченнями:\n' + prev.map(x=>`— ${new Date(x.at).toLocaleDateString('uk-UA')}, «${x.q.slice(0,60)}»: ${x.a.replace(/\s+/g,' ').slice(0,500)}`).join('\n') : ''; })()}`; }

async function askClaude(prompt){
  if(DESKTOP && window.ewiStore.claudeAsk) return window.ewiStore.claudeAsk(prompt);

}

  const C = {}; box.querySelectorAll('[data-c]').forEach(e=>C[e.dataset.c]=e);
  const starts = []; { let c = 0; items.forEach(it=>{ starts.push(c); c += it.d; }); }

  let layout = scoreView(R.staff, items, vopts()); viewToggle(R.staff, ()=>{ layout = scoreView(R.staff, items, vopts()); layout.update(cur>=0 ? starts[idx[cur]] : 0); });

  let cur = -1, seg = null, segTimer = 0, active = false, misses = 0, firstTry = 0, waitFrom = 0; const waits = [];
  const bpm = () => clamp(+C.bpm.value || ex.bpm, 30, 260);
  const segEnd = k => k+1 < idx.length ? starts[idx[k+1]] : total;
  const show = () => { layout.setMarks && layout.setMarks(marks); if(cur >= 0 && cur < idx.length){ const i = idx[cur]; marks.forEach((m,j)=>{ if(m.cls==='cur') delete m.cls; }); if(!marks[i].cls) marks[i].cls = 'cur';

  // зіграти відрізок супроводу [a, b) у долях
  function playSeg(a, b, onEnd){ if(seg){ seg.stop(); clearTimeout(segTimer); }

  function stop(){ active = false; if(seg){ seg.stop(); seg = null; } clearTimeout(segTimer); C.go.textContent = 'Почати'; cur = -1; }

// Ритмічна фігура на одній ноті: грай будь-яку ноту на EWI або стукай пробілом.
const RT_CELLS = {

  3: [['q.','e'],['e','q','e'],['e','e'],['q'],['r:e','e'],['e','r:e']],

  const keyUp = e => { if(e.code !== 'Space') return; down = false; emitNoteOff(71 + Settings.offset, now(), 'key'); };
  addEventListener('keydown', key); addEventListener('keyup', keyUp);
  const make = () => { const level = +$('rtL').value, bpm = clamp(+$('rtB').value||80, 40, 200); LS.set('rtrainer', {level, bpm}); if(stop) stop();
    stop = RUNNERS.rhythm($('rtBox'), {type:'rhythm', title:`Ритм, рівень ${level}`, how:'Будь-яка нота або пробіл. Важливий лише момент початку кожної ноти.', seq:rtPattern(level), bpm, beats:4, tol: level >= 4 ? 60 : 80, key:'rtrainer.'+level, anyPitch:true, pass:80},
      { done:res=>{ Progress.rhythmTr = Progress.rhythmTr || []; Progress.rhythmTr.unshift({at:Date.now(), level, score:Math.round(res.score)}); Progress.rhythmTr = Progress.rhythmTr.slice(0,50); saveProgress(); }, again:()=>{}, next:make }); };
  $('rtNew').onclick = make; make();
  UI.cleanup = () => { if(stop) stop(); removeEventListener('keydown', key); removeEventListener('keyup', keyUp); };
}

// ---------- Керування вправою: зупинити, почати заново, вчити без поспіху ----------
// Обгортає кожен тип вправи: над нею з'являється панель із кнопками «Зупинити» і «Почати заново»,
// а у вправах з метрономом ще й вибір «У темпі» або «Без поспіху» (режим очікування).
(function(){
  const base = Object.assign({}, RUNNERS);
  const wrap = type => function(box, ex, ctx){
    let stop = null, inner = null, bar = null;
    const canWait = type === 'rhythm' && !ex.anyPitch && parseSeq(ex.seq).some(i=>i.n!=null);
    const modeKey = 'mode.' + (ex.key || ex.title || type);
    let mode = canWait ? LS.get(modeKey, 'tempo') : 'tempo';
    const setMode = m => { mode = m; LS.set(modeKey, m); mount(); };
    let paused = false, how = null;
    // вправи, що чекають на ноту, просто ігнорують гру під час паузи; ті, що йдуть за часом, вміють зупинитись на такті;
    // короткі вправи за часом (динаміка, вібрато, імпровізація, луна) після паузи починаються спочатку
    const SELF = ['notes','long','wait'];
    function doPause(){ if(paused || !stop) return; MinusAudio.stop();
      if(stop.pause && stop.pause()) how = 'runner'; else if(SELF.includes(type) || type === 'rhythm') how = 'hub';
      else { stop(); stop = null; how = 'restart'; }
      Hub.paused = true; paused = true; setUI(); }
    function doResume(){ if(!paused) return; Hub.paused = false; paused = false; setUI();
      if(how === 'runner' && stop && stop.resume) stop.resume(); else if(how === 'restart') mount(); }
    function setUI(){ const pb = box.querySelector('[data-a=pause]'), s = box.querySelector('.pb-state'); if(!pb) return;
      pb.textContent = paused ? '▶ Продовжити' : '⏸ Пауза'; pb.classList.toggle('primary', paused);
      s.textContent = paused ? (how === 'restart' ? 'Пауза. Ця вправа коротка, тож продовжиться спочатку.' : 'Пауза. Гра на інструменті зараз не зараховується.') : ''; }
    const hot = e => { if(e.code !== 'KeyP' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !document.body.contains(box)) return; e.preventDefault(); paused ? doResume() : doPause(); };
    addEventListener('keydown', hot);
    function mount(){
      if(stop){ stop(); stop = null; } Hub.paused = false; paused = false;
      box.innerHTML = `<div class="practice-bar">
        ${canWait ? `<span class="muted">Як вчити:</span><button data-m="tempo" aria-current="${mode==='tempo'}">У темпі</button><button data-m="wait" aria-current="${mode==='wait'}">Без поспіху: чекає на ноту</button>` : ''}
        <span class="pb-state muted"></span><span class="sp"></span><button data-a="pause">⏸ Пауза</button><button data-a="restart">↺ Почати заново</button></div>
        ${canWait && mode==='wait' ? '<p class="muted pb-note">Тут немає темпу: застосунок чекає, поки ти знайдеш потрібну ноту, і лише тоді грає далі. Оцінка в цьому режимі не зараховується, для заліку перемкнись на «У темпі».</p>' : ''}
        <div class="pb-inner"></div>`;
      bar = box.querySelector('.practice-bar'); inner = box.querySelector('.pb-inner');
      bar.querySelectorAll('[data-m]').forEach(b=>b.onclick = () => setMode(b.dataset.m));
      bar.querySelector('[data-a=restart]').onclick = () => mount();
      const pb = bar.querySelector('[data-a=pause]'), stateEl = bar.querySelector('.pb-state');
      pb.onclick = () => paused ? doResume() : doPause();
      if(canWait && mode === 'wait'){
        const exW = {...ex, type:'wait', key:(ex.key||'x') + '.wait', how:'Грай по одній ноті: супровід і метроном чекають на тебе.'};
        stop = base.wait(inner, exW, { done:()=>{ toast('Ноти вивчено. Тепер спробуй у темпі, можна з нижчим темпом.', [['Грати в темпі', ()=>setMode('tempo')]]); }, again:mount, next:()=>setMode('tempo') });
      } else stop = base[type](inner, ex, Object.assign({}, ctx, { again:mount }));
    }
    mount();
    return () => { removeEventListener('keydown', hot); Hub.paused = false; if(stop){ stop(); stop = null; } };
  };
  Object.keys(base).forEach(k => { RUNNERS[k] = wrap(k); });
})();

</script>
