<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Репетитор EWI</title>
<link href="fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEE; --surface:#F6F8F9; --surface2:#EDF1F4; --ink:#15212C; --muted:#5A6875; --line:#C9D1D8;
  --brass:#A8761E; --brass-soft:#EEDDB8; --ok:#2E7A57; --warn:#B9771A; --bad:#B2393A; --breath:#3B6DA6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#151B22;--surface:#1D252E;--surface2:#232D37;--ink:#E4E9EE;--muted:#93A1AE;--line:#33404C;
  --brass:#D3A44A;--brass-soft:#3F3320;--ok:#5CB88A;--warn:#E0A64A;--bad:#E06A68;--breath:#78A6DA;}
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px}
button:hover:not(:disabled){border-color:var(--brass)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
button.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
button.small{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input[type=number],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:80px}
a{color:var(--brass)}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-family:var(--serif);font-weight:700;font-size:24px;margin:0 auto 0 0;letter-spacing:-.01em}
.src{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok)}
.meter{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--breath)}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav.side button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px}
nav.side button[aria-current="true"]{background:var(--brass-soft);font-weight:600}
.view{padding:22px 28px 60px;min-width:0;max-width:1300px}
@media (max-width:900px){.app{grid-template-columns:1fr} nav.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}}

h2.title{font-family:var(--serif);font-size:30px;margin:0 0 4px;line-height:1.15}
h3{font-size:17px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

/* Програма */
.level{margin-bottom:26px}
.level h3{margin:0 0 4px;font-family:var(--serif);font-size:21px}
.level .lvdesc{color:var(--muted);margin:0 0 10px;max-width:70ch}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.lesson-btn{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.lesson-btn .num{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--muted);min-width:2.2ch}
.lesson-btn b{display:block;font-weight:600}
.lesson-btn span{font-size:13px;color:var(--muted)}
.lesson-btn.done .num{color:var(--ok)}
.lesson-btn.next{border-color:var(--brass)}
.lesson-btn.next .num{color:var(--brass)}
.progressbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:420px;margin:6px 0 12px}
.progressbar i{display:block;height:100%;background:var(--ok)}

/* Урок */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 18px}
.steps button{padding:6px 12px;font-size:14px;border-radius:20px}
.steps button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button.passed{border-color:var(--ok);color:var(--ok)}
.steps button.passed[aria-current="true"]{color:var(--bg)}
.theory{max-width:68ch;font-size:16px}
.theory p{margin:0 0 12px}
.theory .note{font-family:var(--serif);font-weight:600;white-space:nowrap}
.theory ul{padding-left:20px;margin:0 0 12px}
.callout{border-left:3px solid var(--brass);padding:4px 0 4px 14px;margin:14px 0;color:var(--ink)}
.navrow{display:flex;justify-content:space-between;margin-top:24px;gap:10px}

/* Вправа */
.ex-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.focus{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;min-height:96px;margin:10px 0}
.big{font-family:var(--serif);font-weight:700;font-size:84px;line-height:.9;min-width:1.4ch}
.keys{font-family:var(--serif);font-size:22px;font-weight:500}
.hint{color:var(--muted);margin-top:6px;min-height:1.5em}
.hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)}
.staffwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:10px 0}
.staffwrap svg{display:block}
.cv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0}
.cv .lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.cv canvas{width:100%;height:120px;display:block}
.cv canvas.tall{height:180px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--brass)}
.result{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--surface2)}
.result .score{font-family:var(--serif);font-size:34px;font-weight:700}
.result.pass .score{color:var(--ok)} .result.fail .score{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.stat b{display:block;font-family:var(--serif);font-size:22px}
.stat span{font-size:12.5px;color:var(--muted)}

.side-ewi svg{width:100%;max-width:190px;display:block;margin:0 auto}
.live{margin-top:14px;font-size:13.5px}
.live div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}

/* Аналізатор */
.tuner{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.tuner .big{font-size:110px}
.needle{width:min(420px,100%)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
textarea.report{width:100%;min-height:160px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}
.kbd{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.staffwrap{scroll-behavior:auto}}

.lesson-btn.locked{opacity:.62}
.lesson-btn.locked .num{background:none}

#toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;max-width:min(560px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--brass);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast[hidden]{display:none}

.tracks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.tracks .chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);cursor:pointer;font-size:14px}
.tracks .chip:has(input:not(:checked)){opacity:.55}
.section-ui{margin:2px 0 10px;display:flex;flex-direction:column;gap:6px}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat .cell{min-width:22px;height:22px;padding:0 4px;border:2px solid transparent;border-radius:4px;font-size:10px;color:#fff;line-height:18px}
.heat .cell.sel{border-color:var(--ink)}
.perform{background:var(--bg);overflow:auto}
.perform:fullscreen{padding:16px 24px}
.pf-bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.pf-row{position:relative;padding:6px 0 0 28px;border-radius:10px;margin-bottom:4px}
.pf-row svg{display:block;height:auto}
.pf-row.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--brass)}
.pf-num{position:absolute;left:6px;top:46px;font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px 12px;opacity:.55;display:flex;flex-direction:column;gap:2px}
.badge b{font-size:14px}.badge span{font-size:12px;color:var(--muted)}
.badge.got{opacity:1;border-color:var(--brass);background:var(--brass-soft)}
.reading .rd-staff{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:center}
.reading .rd-staff svg{width:min(360px,100%);height:auto}

.lesson-btn.here{background:var(--brass-soft);border:2px solid var(--brass);box-shadow:0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent)}
.lesson-btn.here .num{color:var(--brass)}
.lesson-btn.here span{color:var(--ink)}
.lesson-btn .mini{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;max-width:160px}
.lesson-btn .mini i{display:block;height:100%;background:var(--brass)}
.here-call{border-left-color:var(--brass)}

.view-toggle{display:flex;gap:6px;align-items:center;margin:0 0 6px}
.view-toggle button{padding:4px 12px;font-size:13px;border-radius:999px}
.view-toggle button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.as-roll{overflow:hidden!important}
canvas.roll{width:100%;display:block;border-radius:10px;background:var(--surface)}
.meter{display:inline-block;width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.practice-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.practice-bar .sp{flex:1}
.practice-bar button{padding:5px 12px;font-size:13px}
.practice-bar button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pb-note{margin:-4px 0 10px}
.panel.stopped{text-align:center;padding:28px}

</style>
</head>
<body>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const sd = a => { const m = mean(a); return a.length ? Math.sqrt(mean(a.map(x=>(x-m)**2))) : 0; };
const now = () => performance.now();

// ---------- Збереження ----------
const DESKTOP = typeof window !== 'undefined' && !!window.ewiStore;
const LS = DESKTOP ? {
  // настільна версія: файли в папці даних на диску
  get(k, d){ try{ const v = window.ewiStore.get(k); return v==null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ window.ewiStore.set(k, v); }catch(e){} }
} : {
  get(k, d){ try{ const v = localStorage.getItem('ewi2.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ewi2.'+k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULT_SETTINGS = {
  offset:0, anyOct:false, noteSource:'auto', latMidi:0, latAudio:70, a4:440, bendRange:2,
  gate:-52, unlockAll:false, backVol:0.7, realistic:true, remindAt:'19:00', remind:false, labels:{L1:'Л1',L2:'Л2',L3:'Л3',R1:'П1',R2:'П2',R3:'П3',GS:'G♯',EB:'E♭',LC:'C'},
  guide:true, metroVol:0.6
};
const Settings = Object.assign({}, DEFAULT_SETTINGS, LS.get('settings', {}));
Settings.labels = Object.assign({}, DEFAULT_SETTINGS.labels, Settings.labels);
const saveSettings = () => LS.set('settings', Settings);

const Progress = Object.assign({lessons:{}, days:{}, wrong:{}, log:[]}, LS.get('progress', {}));
const saveProgress = () => { LS.set('progress', Progress); if(typeof checkBadges==='function') setTimeout(checkBadges, 0); };
const today = () => new Date().toISOString().slice(0,10);

// ---------- Ноти й аплікатура ----------
const NAMES = ['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const FINGER = {
  0:['L2'], 1:[], 2:['L1','L2','L3','R1','R2','R3'], 3:['L1','L2','L3','R1','R2','R3','EB'],
  4:['L1','L2','L3','R1','R2'], 5:['L1','L2','L3','R1'], 6:['L1','L2','L3','R2'],
  7:['L1','L2','L3'], 8:['L1','L2','L3','GS'], 9:['L1','L2'], 10:['L1','R1'], 11:['L1']
};
const pc = n => ((n%12)+12)%12;
function parseNote(s){
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(s); if(!m) return null;
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]], acc = m[2]==='#'?1:m[2]==='b'?-1:0;
  return {midi:(+m[3]+1)*12+base+acc, letter:m[1], acc:m[2], oct:+m[3]};
}
const nameOf = n => NAMES[pc(n)] + (Math.floor(n/12)-1);
const pcName = n => NAMES[pc(n)];
function keysOf(n){ if(n===60) return ['L1','L2','L3','R1','R2','R3','LC']; return FINGER[pc(n)]; }
function rollerOf(n){ if(n===60) return 0; return Math.floor((n-62)/12); }
const rollerText = r => r===0 ? '' : (r>0?'ролик +'+r:'ролик −'+(-r));
function keysFull(n){ const k = keysOf(n).map(x=>Settings.labels[x]); const r = rollerText(rollerOf(n));
  return [k.length?k.join(' '):'усі відкриті', r].filter(Boolean).join(', '); }
const withKeys = n => `${pcName(n)} (${keysFull(n)})`;
function keysShort(n){
  const k = keysOf(n); if(!k.length) return ['відкр.'];
  const L = Settings.labels, l = k.filter(x=>/^L\d/.test(x)), r = k.filter(x=>/^R\d/.test(x));
  const a = [l.map(x=>L[x]).join(''), k.includes('GS')?L.GS:''].filter(Boolean).join(' ');
  const b = [r.map(x=>L[x]).join(''), k.includes('EB')?L.EB:'', k.includes('LC')?L.LC:''].filter(Boolean).join(' ');
  const out = [a,b].filter(Boolean); const rr = rollerOf(n); if(rr) out.push((rr>0?'+':'−')+Math.abs(rr)+' окт');
  return out;
}
// "G4:1 A4:0.5 r:1" -> [{n:67|null, d:1, s:'G4'}]
function parseSeq(str){
  return str.trim().split(/\s+/).filter(Boolean).map(tok=>{
    const [s,d] = tok.split(':'); const dur = d ? parseDur(d) : 1;
    if(s==='r') return {n:null, d:dur, s:'r'};
    const p = parseNote(s); return {n:p?p.midi:null, d:dur, s, p};
  });
}
// у тексті уроків {G4} → G (Л1 Л2 Л3)
function noteText(s){ return s.replace(/\{([A-G][#b]?-?\d)\}/g, (_,x)=>`<span class="note">${esc(withKeys(parseNote(x).midi))}</span>`)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
const hz2midi = hz => 69 + 12*Math.log2(hz/Settings.a4);
const midi2hz = m => Settings.a4 * Math.pow(2,(m-69)/12);

// ---------- Шина подій вводу ----------
// paused: під час паузи вправи гра на інструменті не зараховується (ноти й дихання не доходять до вправ)
const Hub = { subs:new Set(), paused:false, on(f){ this.subs.add(f); return ()=>this.subs.delete(f); },
  emit(type, d){ if(this.paused && (type==='on' || type==='off' || type==='breath')) return; this.subs.forEach(f=>{ try{ f(type,d); }catch(e){ console.error(e); } }); } };
const Live = { breath:0, breathSrc:'', note:null, cents:null, hz:0, db:-100, lastMidiNote:0, lastMidiBreath:0,
  midiNames:[], micOn:false, vib:null, centroid:0, activity:0 };

function useMidiNotes(){ if(Settings.noteSource==='midi') return true; if(Settings.noteSource==='audio') return false;
  return Live.midiNames.length>0 || now()-Live.lastMidiNote < 15000; }

function emitNoteOn(n, t, src){ Live.note = n; Live.activity = t; Hub.emit('on', {n, t, src}); }
function emitNoteOff(n, t, src){ if(Live.note===n) Live.note = null; Hub.emit('off', {n, t, src}); }
function emitBreath(v, t, src){
  if(src==='audio' && now()-Live.lastMidiBreath < 2000) return;
  if(src==='midi') Live.lastMidiBreath = t;
  Live.breath = v; Live.breathSrc = src; Hub.emit('breath', {v, t, src});
}

// ---------- MIDI ----------
let midiAccess = null; const midiSeen = {};
function onMidi(e){
  const [st,d1,d2] = e.data, type = st & 0xf0, t = now() - Settings.latMidi;
  if(type===0x90 && d2>0){ Live.lastMidiNote = t; if(useMidiNotes()) emitNoteOn(d1, t, 'midi'); }
  else if(type===0x80 || (type===0x90 && d2===0)){ if(useMidiNotes()) emitNoteOff(d1, t, 'midi'); }
  if(type===0xB0) Hub.emit('cc', {num:d1, v:d2, t});
  else if(type===0xB0 && (d1===2||d1===11||d1===7)){ midiSeen['cc'+d1]=1; if(d1===2 || (!midiSeen.cc2 && (d1===11 || !midiSeen.cc11))) emitBreath(d2, t, 'midi'); }
  else if(type===0xD0){ midiSeen.at=1; if(!midiSeen.cc2 && !midiSeen.cc11) emitBreath(d1, t, 'midi'); }
  else if(type===0xE0){ const v = (d2<<7)|d1; Hub.emit('bend', {cents:(v-8192)/8192*Settings.bendRange*100, t}); }
}
function bindMidi(){
  Live.midiNames = [];
  if(midiAccess) midiAccess.inputs.forEach(inp=>{ Live.midiNames.push(inp.name); inp.onmidimessage = onMidi; });
  Hub.emit('status');
}
function initMidi(){
  if(!navigator.requestMIDIAccess){ Live.midiErr = 'Браузер без Web MIDI'; Hub.emit('status'); return; }
  navigator.requestMIDIAccess().then(a=>{ midiAccess=a; a.onstatechange=bindMidi; bindMidi(); })
    .catch(()=>{ Live.midiErr = DESKTOP ? 'MIDI недоступне' : 'MIDI заблоковано в Chrome'; Hub.emit('status'); });
}

// ---------- Аудіо: контекст, синтезатор, метроном ----------
let AC = null;
function ac(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'}); MASTER = AC.createGain(); MASTER.connect(AC.destination);
    if(Settings.sinkId && AC.setSinkId) AC.setSinkId(Settings.sinkId).catch(()=>{ Settings.sinkId = ''; saveSettings(); }); }
  if(AC.state==='suspended') AC.resume(); return AC; }
// діагностика і вибір пристрою виводу звуку
async function audioOutputs(){ try{ let ds = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput');
    if(ds.length && ds.every(d=>!d.label)){ try{ const s = await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); ds = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput'); }catch(e){} }
    return ds; }catch(e){ return []; } }
async function setOutput(id){ Settings.sinkId = id || ''; saveSettings(); const a = ac(); if(a.setSinkId){ try{ await a.setSinkId(Settings.sinkId); return true; }catch(e){ return false; } } return false; }
async function soundTest(){ const a = ac(); if(a.state !== 'running'){ try{ await a.resume(); }catch(e){} }
  const an = a.createAnalyser(); an.fftSize = 1024; bus().connect(an); let peak = 0; const iv = setInterval(()=>{ const b = new Float32Array(1024); an.getFloatTimeDomainData(b); for(const x of b) peak = Math.max(peak, Math.abs(x)); }, 20);
  const t = a.currentTime + 0.1; [67, 71, 74].forEach((n,i)=>tone(n, t + i*0.35, 0.3, 0.2));
  await new Promise(r=>setTimeout(r, 1300)); clearInterval(iv); try{ bus().disconnect(an); }catch(e){}

  db(){ return this._db || (this._db = new Promise((res, rej)=>{ const r = indexedDB.open('ewi-media', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('f'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); })); },
  async put(name, blob){ if(DESKTOP) return window.ewiStore.saveMedia(name, new Uint8Array(await blob.arrayBuffer()));
    const db = await this.db(); await new Promise((res, rej)=>{ const tx = db.transaction('f','readwrite'); tx.objectStore('f').put(blob, name); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); }); return name; },
  async pick(a){ return a && a.semis && a.tfile ? a.tfile : a && a.file; },
  async url(name){ if(!name) return null; if(DESKTOP) return 'ewimedia://rep/' + encodeURIComponent(name);
    const db = await this.db(); const blob = await new Promise(res=>{ const r = db.transaction('f').objectStore('f').get(name); r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null); });
    return blob ? URL.createObjectURL(blob) : null; }
};

// ---------- Вигляд нот: нотний стан або нотна стрічка ----------
const isRoll = () => Settings.view === 'roll' || Settings.view === 'tape';
const VIEW_NAMES = { staff:'Нотний стан', roll:'Стрічка: падаючі ноти', tape:'Стрічка: горизонтальна' };
// Нотна стрічка: ноти падають згори до лінії гри; кожна смуга — висота звуку, на блоці назва і клавіші
function mountRoll(host, items, o={}){
  host.innerHTML = `<canvas class="roll" style="height:${o.height||320}px"></canvas>`; host.classList.add('as-roll');
  const cv = host.querySelector('canvas'), rhythmic = !!o.rhythmic, beats = o.beats||4, pickup = o.pickup||0;
  const starts = []; let cum = 0; items.forEach((it,i)=>{ starts.push(rhythmic ? cum : i); cum += rhythmic ? it.d : 1; });
  const total = cum, notes = items.map((it,i)=>({it, i, s:starts[i], d: rhythmic ? it.d : 0.86})).filter(x=>x.it.n!=null);
  const ns = notes.map(x=>x.it.n), lo = Math.min(...ns, 67) - 1, hi = Math.max(...ns, 67) + 1;
  let cursor = 0, marks = o.marks || [];
  const chords = o.chordLabels || [];
  function draw(){
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if(!W) return;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
    const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const C = { ink:css('--ink'), muted:css('--muted'), line:css('--line'), surface:css('--surface'), brass:css('--brass'), ok:css('--ok'), bad:css('--bad'), warn:css('--warn')||css('--brass') };
    if(Settings.view === 'tape'){ drawTape(g, W, H, C); return; }
    const left = 34, lanes = hi - lo + 1, lw = (W - left - 8) / lanes, hitY = H - 40, ppb = rhythmic ? 64 * (Settings.rollZoom || 1) : 58;
    const X = n => left + (n - lo) * lw, Y = b => hitY - (b - cursor) * ppb;
    // смуги: чорні клавіші трохи темніші, підписи нот унизу
    for(let n=lo; n<=hi; n++){ if([1,3,6,8,10].includes(pc(n))){ g.fillStyle = C.line; g.globalAlpha = 0.35; g.fillRect(X(n), 0, lw, hitY); g.globalAlpha = 1; } }
    // долі й такти
    if(rhythmic){ for(let b = Math.floor(cursor - 2); b < cursor + hitY/ppb + 1; b++){ if(b < 0 || b > total) continue; const y = Y(b), bar = (b - pickup) % beats === 0 || b === 0;
      g.strokeStyle = C.line; g.lineWidth = bar ? 1.6 : 0.6; g.beginPath(); g.moveTo(left, y); g.lineTo(W-8, y); g.stroke();
      if(bar){ g.fillStyle = C.muted; g.font = '10px sans-serif'; g.textAlign = 'right'; g.fillText(String(Math.floor((b - pickup)/beats) + (pickup?2:1)), left - 4, y + 3); } } }
    chords.forEach(c=>{ const y = Y(c.b); if(y < 10 || y > hitY) return; g.fillStyle = C.brass; g.font = 'bold 12px sans-serif'; g.textAlign = 'left'; g.fillText(c.name, left + 2, y - 3); });
    // ноти
    notes.forEach(x=>{ const yb = Y(x.s), yt = Y(x.s + x.d) + 2; if(yb < -5 || yt > hitY + 30) return;
      const m = marks[x.i] || {}, curNow = cursor >= x.s && cursor < x.s + (rhythmic ? x.d : 1);
      const col = m.cls==='ok' ? C.ok : m.cls==='bad' ? C.bad : m.cls==='warn' ? C.warn : (m.cls==='cur' || curNow) ? C.brass : C.ink;
      const past = !m.cls && x.s + x.d < cursor - 0.01;
      g.globalAlpha = past ? 0.3 : 1; g.fillStyle = col; const bx = X(x.it.n) + 2, bw = Math.max(8, lw - 4), bh = Math.max(10, yb - yt);
      g.beginPath(); g.roundRect ? g.roundRect(bx, yb - bh, bw, bh, 5) : g.rect(bx, yb - bh, bw, bh); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'center'; const cx = bx + bw/2, p = parseNote(x.it.s), nm = p.letter + (p.acc==='#'?'♯':p.acc==='b'?'♭':'');
      if(bh >= 16){ g.font = `bold ${Math.min(14, Math.max(10, lw*0.32))}px sans-serif`; g.fillText(nm, cx, yb - bh + 13); }
      if(Settings.rollKeys !== false && bh >= 34 && lw >= 30){ g.font = `${Math.min(11, Math.max(8, lw*0.22))}px sans-serif`; keysShort(x.it.n).slice(0,2).forEach((t,k)=>g.fillText(t, cx, yb - bh + 26 + k*11)); }
      g.globalAlpha = 1; });
    // лінія гри
    g.strokeStyle = C.brass; g.lineWidth = 3; g.beginPath(); g.moveTo(left, hitY); g.lineTo(W-8, hitY); g.stroke();
    g.fillStyle = C.muted; g.font = '10px sans-serif'; g.textAlign = 'center';
    for(let n=lo; n<=hi; n++) if(ns.includes(n)) g.fillText(pcName(n), X(n) + lw/2, hitY + 16);
  }
  // горизонтальна стрічка: висота звуку — по вертикалі, час іде справа наліво до лінії гри
  function drawTape(g, W, H, C){
    const top = 22, bottom = H - 8, left = 40, lanes = hi - lo + 1, lh = (bottom - top) / lanes, hitX = left + 90, ppb = rhythmic ? 90 * (Settings.rollZoom || 1) : 80;
    const Y = n => bottom - (n - lo + 1) * lh, X = b => hitX + (b - cursor) * ppb;
    for(let n=lo; n<=hi; n++){ if([1,3,6,8,10].includes(pc(n))){ g.fillStyle = C.line; g.globalAlpha = 0.35; g.fillRect(left, Y(n), W - left, lh); g.globalAlpha = 1; }
      if(ns.includes(n)){ g.fillStyle = C.muted; g.font = '10px sans-serif'; g.textAlign = 'right'; g.fillText(pcName(n), left - 4, Y(n) + lh/2 + 3); } }
    if(rhythmic){ for(let b = Math.floor(cursor - hitX/ppb) - 1; b < cursor + (W - hitX)/ppb + 1; b++){ if(b < 0 || b > total) continue; const x = X(b), bar = (b - pickup) % beats === 0 || b === 0;
      g.strokeStyle = C.line; g.lineWidth = bar ? 1.6 : 0.6; g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke();
      if(bar){ g.fillStyle = C.muted; g.font = '10px sans-serif'; g.textAlign = 'center'; g.fillText(String(Math.floor((b - pickup)/beats) + (pickup?2:1)), x, top - 8); } } }
    chords.forEach(c=>{ const x = X(c.b); if(x < left || x > W) return; g.fillStyle = C.brass; g.font = 'bold 12px sans-serif'; g.textAlign = 'left'; g.fillText(c.name, x + 3, top + 2); });
    g.save(); g.beginPath(); g.rect(left, 0, W - left, H); g.clip();
    notes.forEach(x=>{ const xl = X(x.s), xr = X(x.s + x.d) - 2; if(xr < left - 5 || xl > W + 5) return;
      const m = marks[x.i] || {}, curNow = cursor >= x.s && cursor < x.s + (rhythmic ? x.d : 1);
      const col = m.cls==='ok' ? C.ok : m.cls==='bad' ? C.bad : m.cls==='warn' ? C.warn : (m.cls==='cur' || curNow) ? C.brass : C.ink;
      const past = !m.cls && x.s + x.d < cursor - 0.01, bw = Math.max(10, xr - xl), by = Y(x.it.n) + 1, bh = Math.max(8, lh - 2);
      g.globalAlpha = past ? 0.3 : 1; g.fillStyle = col; g.beginPath(); g.roundRect ? g.roundRect(xl, by, bw, bh, 5) : g.rect(xl, by, bw, bh); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'left'; const p = parseNote(x.it.s), nm = p.letter + (p.acc==='#'?'♯':p.acc==='b'?'♭':''), fs = Math.min(13, Math.max(9, bh*0.6));
      g.save(); g.beginPath(); g.rect(xl, by, bw, bh); g.clip(); const tx = Math.max(xl, left) + 4;
      if(bw >= 16){ g.font = `bold ${fs}px sans-serif`; g.fillText(nm, tx, by + bh/2 + fs*0.35); }
      if(Settings.rollKeys !== false && bw >= 50){ g.font = `${Math.max(8, fs-2)}px sans-serif`; g.fillText(keysShort(x.it.n).join(' '), tx + fs*1.4, by + bh/2 + fs*0.32); }
      g.restore(); g.globalAlpha = 1; });
    g.restore();
    g.strokeStyle = C.brass; g.lineWidth = 3; g.beginPath(); g.moveTo(hitX, top - 4); g.lineTo(hitX, bottom); g.stroke();
  }
  draw(); const ro = new ResizeObserver(draw); ro.observe(cv);
  return { kind:'roll', starts, update(b){ cursor = b; draw(); }, focusIndex(i){ cursor = starts[Math.max(0, Math.min(i, starts.length-1))] ?? 0; draw(); },
    setMarks(m){ marks = m; draw(); }, beatToX(){ return 0; } };
}
// Єдиний інтерфейс для обох виглядів: update(beat) рухає курсор, focusIndex(i) показує ноту i
function scoreView(host, items, o={}){
  if(isRoll()) return mountRoll(host, items, o);
  host.classList.remove('as-roll');
  const lay = mountStaff(host, items, o);
  if(o.chordLabels && o.chordLabels.length && o.rhythmic){ const svg = host.querySelector('svg');
    if(svg) svg.insertAdjacentHTML('beforeend', o.chordLabels.map(c=>`<text x="${lay.beatToX(c.b)}" y="14" font-size="12" font-weight="700" fill="var(--brass)">${esc(c.name)}</text>`).join('')); }
  return { kind:'staff', xs:lay.xs, beatToX:lay.beatToX,
    update(b){ const x = lay.beatToX(b), cur = host.querySelector('#cursor'); if(cur){ cur.setAttribute('x1',x); cur.setAttribute('x2',x); } scrollStaff(host, x); },
    focusIndex(i){ scrollStaff(host, lay.xs[Math.max(0, Math.min(i, lay.xs.length-1))]); }, setMarks(){} };
}
// Перемикач «Нотний стан / Стрічка» над нотами
function viewToggle(host, onChange){
  const el = document.createElement('div'); el.className = 'view-toggle';
  const render = () => { const cur = Settings.view || 'staff';
    el.innerHTML = Object.entries(VIEW_NAMES).map(([k,t])=>`<button data-v="${k}" aria-current="${k===cur}">${t}</button>`).join('')
      + (isRoll() ? `<label class="muted">масштаб <input type="range" data-z min="0.5" max="2.5" step="0.1" value="${Settings.rollZoom||1}"></label><label class="muted"><input type="checkbox" data-k ${Settings.rollKeys!==false?'checked':''}> клавіші на нотах</label>` : '');
    el.querySelectorAll('[data-v]').forEach(b=>b.onclick = ()=>{ Settings.view = b.dataset.v; saveSettings(); render(); onChange(); });
    const z = el.querySelector('[data-z]'); if(z) z.oninput = () => { Settings.rollZoom = +z.value; saveSettings(); onChange(); };
    const kk = el.querySelector('[data-k]'); if(kk) kk.onchange = () => { Settings.rollKeys = kk.checked; saveSettings(); onChange(); }; };
  render(); host.before(el); return el;

// позиції акордів для підписів: "Am7:2 D7:2" → [{b:0,name:'Am7'},...]
function chordLabelsOf(chords){ if(!chords || typeof chords !== 'string') return []; const out = []; let p = 0, last = '';
  parseChords(chords).forEach(c=>{ if(c.name && c.name !== last) out.push({b:p, name:c.name}); last = c.name; p += c.beats; }); return out; }

// ---------- Нотний стан (з ритмом) ----------
const REST = {4:'𝄻',3:'𝄼',2:'𝄼',1.5:'𝄽',1:'𝄽',0.75:'𝄾',0.5:'𝄾',0.25:'𝄿'};
function staffSVG(items, o={}){
  const beats = o.beats||4, den = o.den||4, rhythmic = !!o.rhythmic, marks = o.marks||[], Q = d => d*4/den, near = (a,b)=>Math.abs(a-b)<0.02;
  const y = s => 94-(s-30)*6, step = p => p.oct*7+'CDEFGAB'.indexOf(p.letter);
  let x = rhythmic ? 96 : 90, cum = 0; const xs = [], starts = [], parts = [];
  items.forEach((it,i)=>{
    xs.push(x); starts.push(cum);
    const m = marks[i]||{}, col = m.cls==='cur'?'var(--brass)':m.cls==='ok'?'var(--ok)':m.cls==='warn'?'var(--warn)':m.cls==='bad'?'var(--bad)':'var(--ink)';
    if(it.n==null){
      parts.push(`<text x="${x}" y="80" text-anchor="middle" font-size="30" font-family="Noto Music,serif" fill="${col}">${REST[Q(it.d)]||'𝄽'}</text>`);
      if([3,1.5,0.75].includes(Q(it.d))) parts.push(`<circle cx="${x+11}" cy="66" r="2" fill="${col}"/>`);
    } else {
      const p = parseNote(it.s), st = step(p), cy = y(st);
      for(let l=28;l>=st;l-=2) parts.push(`<line x1="${x-12}" x2="${x+12}" y1="${y(l)}" y2="${y(l)}" stroke="var(--muted)"/>`);
      for(let l=40;l<=st;l+=2) parts.push(`<line x1="${x-12}" x2="${x+12}" y1="${y(l)}" y2="${y(l)}" stroke="var(--muted)"/>`);
      if(p.acc) parts.push(`<text x="${x-20}" y="${cy+5}" font-size="16" text-anchor="middle" fill="${col}">${p.acc==='#'?'♯':'♭'}</text>`);
      const q = Q(it.d), hollow = rhythmic && q>=2;
      parts.push(`<ellipse cx="${x}" cy="${cy}" rx="7.2" ry="5" transform="rotate(-20 ${x} ${cy})" fill="${hollow?'none':col}" stroke="${col}" stroke-width="${hollow?2:0}"/>`);
      if(rhythmic && q<4){
        const up = st < 34, sx = up ? x+6.6 : x-6.6, ey = up ? cy-34 : cy+34;
        parts.push(`<line x1="${sx}" x2="${sx}" y1="${cy}" y2="${ey}" stroke="${col}" stroke-width="1.4"/>`);
        const flags = (near(q,0.5)||near(q,0.75)||near(q,1/3)) ? 1 : near(q,0.25) ? 2 : 0;
        if(near(q,1/3) && Math.abs(cum*3-Math.round(cum*3))<0.01 && Math.round(cum*3)%3===0) parts.push(`<text x="${x+10}" y="${up?ey-6:ey+14}" text-anchor="middle" font-size="11" font-style="italic" fill="${col}">3</text>`);
        for(let f=0; f<flags; f++){ const fy = ey + (up?1:-1)*f*7;
          parts.push(`<path d="M${sx} ${fy} q 9 ${up?8:-8} 7 ${up?20:-20}" fill="none" stroke="${col}" stroke-width="1.6"/>`); }
        if([3,1.5,0.75].includes(q)) parts.push(`<circle cx="${x+12}" cy="${st%2===0?cy-3:cy}" r="2" fill="${col}"/>`);
      }
      if(m.cls==='cur') parts.push(`<circle cx="${x}" cy="${cy}" r="14" fill="none" stroke="var(--brass)" stroke-width="1.5"/>`);
      if(!o.nolabels) parts.push(`<text x="${x}" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="${col}" font-family="Spectral,serif">${p.letter}${p.acc==='#'?'♯':p.acc==='b'?'♭':''}</text>`);
      if(!o.nolabels) keysShort(p.midi).forEach((ln,j)=>parts.push(`<text x="${x}" y="${175+j*13}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(ln)}</text>`));
    }
    if(m.top) parts.push(`<text x="${x}" y="20" text-anchor="middle" font-size="11" fill="${col}">${esc(m.top)}</text>`);
    x += rhythmic ? Math.max(60, 30 + Q(it.d)*34) : 66; cum += it.d;
    if(rhythmic && cum > (o.pickup||0) - 1e-4 && Math.abs((cum-(o.pickup||0))/beats - Math.round((cum-(o.pickup||0))/beats))<1e-4 && i<items.length-1){ parts.push(`<line x1="${x-14}" x2="${x-14}" y1="46" y2="94" stroke="var(--muted)"/>`); x += 6; }
  });
  const W = x + 16, H = 216;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<5;k++) svg += `<line x1="8" x2="${W-8}" y1="${46+k*12}" y2="${46+k*12}" stroke="var(--muted)"/>`;
  svg += `<text x="10" y="100" font-size="70" font-family="Noto Music,serif" fill="var(--ink)">𝄞</text>`;
  if(rhythmic) svg += `<text x="60" y="68" font-size="17" font-weight="700" font-family="Spectral,serif" fill="var(--ink)">${beats}</text><text x="60" y="92" font-size="17" font-weight="700" font-family="Spectral,serif" fill="var(--ink)">${den}</text>`;
  svg += parts.join('') + `<line id="cursor" x1="-10" x2="-10" y1="30" y2="110" stroke="var(--brass)" stroke-width="2"/></svg>`;
  const total = cum;
  const beatToX = b => { if(b<=0) return xs[0]-20; for(let i=0;i<starts.length;i++){ const s=starts[i], e = i+1<starts.length?starts[i+1]:total, x0 = xs[i], x1 = i+1<xs.length?xs[i+1]:W-16;
      if(b < e) return x0 + (b-s)/(e-s)*(x1-x0); } return W-16; };

function mountStaff(host, items, o){ const r = staffSVG(items, o); host.innerHTML = r.svg; return r; }
function scrollStaff(host, x){ host.scrollLeft = Math.max(0, x - host.clientWidth/2); }

// ---------- Схема EWI ----------
function ewiSVG(keys, roll){
  const k = id=>keys.includes(id), f = id=>k(id)?'var(--brass)':'none', t = id=>k(id)?'#fff':'var(--muted)', L = Settings.labels;
  const key = (id,cy)=>`<circle cx="60" cy="${cy}" r="15" fill="${f(id)}" stroke="var(--ink)" stroke-width="1.5"/><text x="60" y="${cy+4}" text-anchor="middle" font-size="11" fill="${t(id)}">${esc(L[id])}</text>`;
  const side = (id,x,cy)=>`<rect x="${x}" y="${cy-10}" width="24" height="20" rx="8" fill="${f(id)}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x+12}" y="${cy+4}" text-anchor="middle" font-size="9" fill="${t(id)}">${esc(L[id])}</text>`;
  const rt = roll ? (roll>0?'+'+roll:'−'+(-roll)) : '0';
  return `<svg viewBox="0 0 124 430" xmlns="http://www.w3.org/2000/svg">
    <path d="M52 6 h16 l4 34 h-24z" fill="var(--line)"/>
    <rect x="34" y="40" width="52" height="380" rx="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="4" y="60" width="24" height="70" rx="6" fill="${roll?'var(--brass-soft)':'none'}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="16" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${rt}</text>
    <text x="16" y="146" text-anchor="middle" font-size="9" fill="var(--muted)">ролики</text>
    ${key('L1',90)}${key('L2',130)}${key('L3',170)}${side('GS',92,172)}
    <line x1="42" x2="78" y1="205" y2="205" stroke="var(--line)"/>
    ${key('R1',240)}${key('R2',280)}${key('R3',320)}${side('EB',92,326)}${side('LC',92,352)}</svg>`;
}

// ---------- Графіки ----------
function cssv(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function prepCanvas(cv){ const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); return {c,w,h}; }
// хвиля дихання: hist [{t,v}], діапазон [t0,t1]
function drawTrace(cv, o){
  const {c,w,h} = prepCanvas(cv); const t1 = o.t1 ?? now(), t0 = o.t0 ?? t1-6000;
  const X = t => (t-t0)/(t1-t0)*w, Y = v => h-4-(v/127)*(h-8);
  if(o.band){ c.fillStyle = cssv('--brass-soft'); c.fillRect(0, Y(o.band[1]), w, Y(o.band[0])-Y(o.band[1])); }
  (o.beats||[]).forEach(b=>{ c.fillStyle = cssv('--line'); c.fillRect(X(b)-0.5, 0, 1, h); });
  (o.events||[]).forEach(e=>{ if(e.t<t0) return; c.fillStyle = e.ok===false?cssv('--bad'):e.ok?cssv('--ok'):cssv('--muted'); c.fillRect(X(e.t)-1, 0, 2, h); });
  if(o.target){ c.strokeStyle = cssv('--brass'); c.lineWidth = 3; c.setLineDash([6,4]); c.beginPath(); o.target.forEach((p,i)=>i?c.lineTo(X(p.t),Y(p.v)):c.moveTo(X(p.t),Y(p.v))); c.stroke(); c.setLineDash([]); }
  c.strokeStyle = cssv('--breath'); c.lineWidth = 2; c.beginPath(); let last = null;
  (o.hist||[]).forEach(s=>{ if(s.t<t0-500) return; const x = X(s.t); if(!last) c.moveTo(x, Y(s.v)); else { c.lineTo(x, Y(last.v)); c.lineTo(x, Y(s.v)); } last = s; });
  if(last && o.extend!==false) c.lineTo(Math.min(w, X(t1)), Y(last.v)); c.stroke();

// ---------- Загальне для вправ ----------

    if(errs.length>2 && Math.abs(mErr) > 25) advice.push(mErr<0 ? `Поспішаєш у середньому на ${Math.round(-mErr)} мс.` : `Запізнюєшся в середньому на ${Math.round(mErr)} мс.`);
    if(wrong.length) advice.push('Перевір аплікатуру: '+[...new Set(wrong)].map(withKeys).join(', ')+'.');
    if(artic!=null && artic<70) advice.push(ex.artic==='legato' ? 'Між нотами провали повітря. Дихай рівно і міняй тільки пальці.' : 'Ноти задовгі. Зупиняй звук язиком приблизно на половині тривалості.');
    if(extra>0) advice.push(`Зайвих нот: ${extra}. Часто це «проміжні» ноти, коли пальці опускаються неодночасно.`);
    const pass = ex.pass||75;
    if(score >= pass && (C.auto.checked || looping)){ const nb = Math.min(bpm+(SEC?SEC.step():4), ex.maxBpm||Math.round(ex.bpm*1.6)); C.bpm.value = nb; LS.set('tempo.'+ex.key, nb); advice.push(`Авто-темп: наступна спроба на ${nb} bpm.`); }

    const paused = hadPause; hadPause = false; if(paused) advice.unshift('Спроба була з паузою, тому не зараховується в урок: для заліку зіграй вправу без зупинок.');
    showResult(R, {score, pass, bpm, advice: advice.join(' ') || 'Чисто і рівно в темпі.',
      stats:[['темп', bpm+' bpm'], ['ноти в часі', errs.filter(e=>Math.abs(e)<=tol).length+'/'+cnt], ['середнє відхилення', errs.length?Math.round(aErr)+' мс':'—'], ...(artic!=null?[[ex.artic==='legato'?'legato':'staccato', Math.round(artic)+'%']]:[]), ['неправильних нот', wrong.length]]}, paused ? Object.assign({}, ctx, {done:()=>{}}) : ctx);
  }
  const cleanup = ()=>{ looping = false; off(); br.off(); stopLoop(); if(run) run.stop(); if(listenH) listenH.stop(); MinusAudio.stop(); if(Rec.mr) recStop(); };
  cleanup.pause = pause; cleanup.resume = resume; return cleanup;
}

// ---------- 4. Динаміка ----------
function runDyn(box, ex, ctx){
  const R = exShell(box, ex, `<button class="primary" data-c="go">Почати</button>`), go = box.querySelector('[data-c=go]');
  const n = parseNote(ex.note).midi, beats = ex.beats||8, bpm = ex.bpm||60, lo = ex.lo??25, hi = ex.hi??110;
  R.cv.classList.add('tall'); R.cvlabel.textContent = 'Дихання і цільова крива';
  mountStaff(R.staff, [{n, d:1, s:ex.note}], {}); setFocus(R, n);
  const shape = x => ex.shape==='cresc' ? lo+(hi-lo)*x : ex.shape==='dim' ? hi-(hi-lo)*x : ex.shape==='swell' ? lo+(hi-lo)*(1-Math.abs(2*x-1)) : ex.shape==='terrace' ? [lo, (lo+hi)/2, hi, (lo+hi)/2][Math.min(3,Math.floor(x*4))] : (lo+hi)/2;
  setHint(R, 'Після такту рахунку грай ноту і веди лінію дихання по пунктиру.');
  const br = breathRecorder(); let run = null, notesOk = 0, notesAll = 0;
  go.onclick = () => { R.result.innerHTML=''; notesOk = notesAll = 0; run = schedule({bpm, beats:4, countIn:countInBars(bpm, 4), totalBeats:beats}); go.disabled = true; };
  const off = listen((type,d)=>{ if(run && type==='on' && d.t > run.t0Perf - 300){ notesAll++; if(matchNote(d.n, n).ok) notesOk++; } });
  const stopLoop = loopFrames(t=>{
    R.cvval.textContent = Live.breath;
    if(!run){ drawTrace(R.cv, {hist:br.hist}); return; }
    const dur = beats*run.spbMs, target = []; for(let i=0;i<=60;i++){ const x=i/60; target.push({t:run.t0Perf + x*dur, v:shape(x)}); }
    drawTrace(R.cv, {hist:br.hist, target, t0:run.t0Perf - 4*run.spbMs, t1:run.t0Perf + dur + 200});
    const beat = (t-run.t0Perf)/run.spbMs; if(beat<0){ const cd = countdownText(beat, run.spbMs, 4); R.big.textContent = cd.secs; setHint(R, cd.text); } else if(beat<beats) setHint(R, ex.shape==='cresc'?'Посилюй…':ex.shape==='dim'?'Стишуй…':'Веди по пунктиру…');
    if(t > run.t0Perf + dur + 300){
      const r = run; run = null; go.disabled = false;
      const xs = br.hist.filter(h=>h.t>=r.t0Perf+150 && h.t<=r.t0Perf+dur);
      // ступінчасто: кожні 50 мс береться останнє значення
      const pts = []; for(let tt=r.t0Perf+150; tt<=r.t0Perf+dur; tt+=50){ let v=0; for(const h of br.hist){ if(h.t<=tt) v=h.v; else break; } pts.push({x:(tt-r.t0Perf)/dur, v}); }
      const mae = mean(pts.map(p=>Math.abs(p.v - shape(p.x))));
      const corr = (()=>{ const a=pts.map(p=>p.v), b=pts.map(p=>shape(p.x)), ma=mean(a), mb=mean(b); let s=0,sa=0,sb=0; a.forEach((v,i)=>{ s+=(v-ma)*(b[i]-mb); sa+=(v-ma)**2; sb+=(b[i]-mb)**2; }); return sa&&sb ? s/Math.sqrt(sa*sb) : 0; })();
      let score = clamp(100 - mae*1.4, 0, 100); if(notesAll && notesOk/notesAll < 0.5) score *= 0.6; if(!xs.length) score = 0;
      const start = pts.slice(0,4).map(p=>p.v), end = pts.slice(-4).map(p=>p.v);
      showResult(R, {score, pass:ex.pass||65, advice: mae<15 ? 'Лінія близька до цілі.' : corr>0.6 ? 'Форма правильна, але рівень гучності зсунутий. Почни '+(mean(start)>shape(0)+10?'тихіше':'гучніше')+'.' : 'Форма не збігається з метою. Розподіли зміну рівномірно на всі долі, не роби її за одну секунду.',
        stats:[['середня похибка', Math.round(mae)], ['збіг форми', Math.round(Math.max(0,corr)*100)+'%'], ['початок', Math.round(mean(start))+' / '+Math.round(shape(0))], ['кінець', Math.round(mean(end))+' / '+Math.round(shape(1))]]}, ctx);
    }
  });
  return ()=>{ off(); br.off(); stopLoop(); if(run) run.stop(); };
}

// ---------- 5. Вібрато ----------
function runVibrato(box, ex, ctx){
  const R = exShell(box, ex), n = parseNote(ex.note).midi, need = ex.secs||3, rate = ex.rate||[4.5,6.5], depth = ex.depth||[12,45];
  mountStaff(R.staff, [{n, d:1, s:ex.note}], {}); setFocus(R, n); R.barw.hidden = false; R.cvlabel.textContent = 'Висота відносно ноти, центи';
  R.extra.innerHTML = `<div class="stats"><div class="stat"><b data-v="rate">—</b><span>частота, Гц (ціль ${rate[0]}–${rate[1]})</span></div><div class="stat"><b data-v="depth">—</b><span>глибина, центи (ціль ${depth[0]}–${depth[1]})</span></div><div class="stat"><b data-v="src">—</b><span>джерело</span></div></div>`;
  const V = {}; R.extra.querySelectorAll('[data-v]').forEach(e=>V[e.dataset.v]=e);
  setHint(R, Live.micOn ? 'Тримай ноту і додай хвилю вібрато.' : 'Увімкни мікрофон угорі, щоб застосунок бачив висоту. Без нього вібрато видно лише якщо EWI надсилає pitch bend.', Live.micOn?'':'warn');
  let good = 0, last = 0, best = {rate:0, depth:0}, startT = now(), done = false; const trace = [];
  const off = listen((type,d)=>{ if(type==='frame' && d.midiF!=null) trace.push({t:d.t, v:clamp(64+(d.midiF*100 - Math.round(d.midiF)*100)*1.2, 0, 127)});
    if(type==='bend' && !Live.micOn) trace.push({t:d.t, v:clamp(64+d.cents*1.2,0,127)}); if(trace.length>3000) trace.splice(0,500); });
  const stopLoop = loopFrames(t=>{
    drawTrace(R.cv, {hist:trace, band:[64-depth[1]*1.2, 64+depth[1]*1.2]});
    const v = Live.vib, held = Live.note!=null && matchNote(Live.note, n).ok;
    V.src.textContent = Live.micOn ? 'мікрофон' : 'pitch bend';
    if(v){ V.rate.textContent = v.rate.toFixed(1); V.depth.textContent = Math.round(v.depth); } else { V.rate.textContent='—'; V.depth.textContent='—'; }
    const okNow = held && v && v.rate>=rate[0] && v.rate<=rate[1] && v.depth>=depth[0] && v.depth<=depth[1];
    if(okNow && last) good += (t-last)/1000; last = t;
    if(v && held){ best = v; }
    R.bar.style.width = Math.min(100, good/need*100)+'%';
    if(!done && (good>=need || t-startT > 45000)){ done = true;
      const score = clamp(good/need*100, 0, 100);
      showResult(R, {score, pass:ex.pass||70, advice: score>=70 ? 'Вібрато рівне і в потрібних межах.' : !best.rate ? 'Вібрато не знайдено. Перевір мікрофон або налаштування bite на EWI.' : best.rate>rate[1] ? 'Хвиля зашвидка, сповільни рух щелепи.' : best.rate<rate[0] ? 'Хвиля заповільна, рухайся частіше.' : best.depth>depth[1] ? 'Задуже, звук «пливе». Зменши глибину.' : 'Замало, вібрато майже не чути. Збільш глибину.',
        stats:[['у межах цілі', good.toFixed(1)+' с'], ['остання частота', best.rate?best.rate.toFixed(1)+' Гц':'—'], ['остання глибина', best.depth?Math.round(best.depth)+' ц':'—']]},
        {...ctx, again:()=>ctx.again()});
    }

}

// ---------- 6. Слух: почуй і повтори ----------
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function runEcho(box, ex, ctx){
  const R = exShell(box, ex, `<button data-c="play">Програти ще раз</button><button class="primary" data-c="go">Почати</button>`);
  const C = {}; box.querySelectorAll('[data-c]').forEach(e=>C[e.dataset.c]=e);
  const phrases = ex.phrases.map(parseSeq); let k = -1, phase = 'idle', got = [], lastOn = 0, pl = null; const scores = [];
  R.staff.innerHTML = '<div class="muted" style="padding:18px">Ноти з\'являться після твоєї відповіді.</div>';
  setHint(R, `${phrases.length} фраз. Послухай, потім повтори на EWI.`); setFocus(R, null);
  const play = () => { const ph = phrases[k]; if(pl) pl.stop(); pl = playSeq(ph, ex.bpm||80); phase = 'listen'; setHint(R, 'Слухай…');
    setTimeout(()=>{ if(phase==='listen'){ phase='answer'; got=[]; lastOn=0; setHint(R, 'Твоя черга. Повтори фразу.'); } }, pl.endPerf - now() + 150); };
  C.play.onclick = () => { if(k>=0 && k<phrases.length) play(); };
  C.go.onclick = () => { C.go.disabled = true; k = 0; play(); };
  const br = breathRecorder();
  const off = listen((type,d)=>{ if(type==='on' && phase==='answer'){ got.push(d.n - Settings.offset); lastOn = d.t; } });
  const stopLoop = loopFrames(t=>{
    drawTrace(R.cv, {hist:br.hist}); R.cvval.textContent = Live.breath;
    if(phase==='answer' && got.length && t - lastOn > 1800){
      const target = phrases[k].filter(i=>i.n!=null).map(i=>i.n), norm = Settings.anyOct ? (x=>pc(x)) : (x=>x);
      const s = Math.max(0, 1 - lev(target.map(norm), got.map(norm))/Math.max(target.length, got.length));
      scores.push(s*100); phase = 'review';
      const marks = phrases[k].map((it,i)=>({cls: it.n==null?'':norm(got[phrases[k].slice(0,i).filter(x=>x.n!=null).length])===norm(it.n)?'ok':'bad'}));
      mountStaff(R.staff, phrases[k], {rhythmic:true, beats:ex.beats||4, marks});
      setHint(R, `Збіг ${Math.round(s*100)}%. Ти зіграв: ${got.map(pcName).join(' ')}.`, s>=0.8?'ok':'warn');
      setTimeout(()=>{ k++; if(k<phrases.length){ R.staff.innerHTML='<div class="muted" style="padding:18px">Наступна фраза…</div>'; play(); } else finish(); }, 2600);
    }
  });
  function finish(){ phase='done'; const score = mean(scores);
    showResult(R, {score, pass:ex.pass||70, advice: score>=80 ? 'Слух упевнено веде пальці.' : 'Співай фразу про себе перед тим, як грати. Спочатку вгадуй напрямок руху, потім точні інтервали.',
      stats: scores.map((s,i)=>['фраза '+(i+1), Math.round(s)+'%'])}, ctx); }
  return ()=>{ off(); br.off(); stopLoop(); if(pl) pl.stop(); };
}

// ---------- 7. Імпровізація ----------
const CHORD = { maj:[0,4,7], min:[0,3,7], dom7:[0,4,7,10], maj7:[0,4,7,11], m7:[0,3,7,10] };
function runImprov(box, ex, ctx){
  const R = exShell(box, ex, `<label class="muted">Темп <input type="number" data-c="bpm" min="40" max="220" value="${ex.bpm}"></label><button class="primary" data-c="go">Почати</button>`);
  const C = {}; box.querySelectorAll('[data-c]').forEach(e=>C[e.dataset.c]=e);
  const scaleNotes = parseSeq(ex.scaleSeq).filter(i=>i.n!=null), pcs = new Set(scaleNotes.map(i=>pc(i.n)));
  const beats = ex.beats||4, bars = ex.bars||8;
  const chords = ex.chords ? ex.chords.map(c=>{ const r = parseNote(c.root).midi; return {name:c.name, beats:c.beats, root:r, tones:CHORD[c.type].map(x=>pc(r+x)), notes:CHORD[c.type].map(x=>r-12+x)}; }) : null;
  const total = chords ? chords.reduce((a,c)=>a+c.beats,0)*(ex.loops||2) : bars*beats;
  const chordSeq = chords ? Array.from({length:ex.loops||2}).flatMap(()=>chords) : null;
  mountStaff(R.staff, scaleNotes, {}); setFocus(R, scaleNotes[0].n);
  setHint(R, 'Над стан виписано звукоряд. Грай фрази тільки з цих нот, залишай паузи між ними.');
  const br = breathRecorder(); let run = null, played = [];
  C.go.onclick = () => { R.result.innerHTML=''; played=[]; const bpm = +C.bpm.value||ex.bpm;
    run = schedule({bpm, beats, countIn:countInBars(bpm, beats), totalBeats:total, drone: chords?null:parseNote(ex.drone).midi, chords:chordSeq, clickOn:true}); C.go.disabled = true; };
  const off = listen((type,d)=>{ if(run && type==='on' && d.t >= run.t0Perf-100) played.push({n:d.n-Settings.offset, t:d.t}); });
  const stopLoop = loopFrames(t=>{
    R.cvval.textContent = Live.breath;
    if(!run){ drawTrace(R.cv, {hist:br.hist}); return; }
    const beat = (t-run.t0Perf)/run.spbMs;
    drawTrace(R.cv, {hist:br.hist, events:played.map(p=>({t:p.t, ok:pcs.has(pc(p.n))}))});
    if(beat<0){ const cd = countdownText(beat, run.spbMs, beats); setHint(R, cd.text); }
    else if(beat<total){ if(chordSeq){ let p=0; for(const c of chordSeq){ if(beat<p+c.beats){ R.big.textContent = c.name; R.keys.textContent = 'звуки акорду: '+c.tones.map(x=>NAMES[x]).join(' '); break; } p+=c.beats; } }
      else setHint(R, `Такт ${Math.floor(beat/beats)+1} з ${bars}`); }
    if(t > run.endPerf + 400){ const r = run; run = null; C.go.disabled = false; evaluate(r); }
  });
  function evaluate(r){
    setFocus(R, scaleNotes[0].n); setHint(R, '');
    if(!played.length){ showResult(R, {score:0, pass:ex.pass||70, advice:'Нот не почуто. Перевір підключення EWI або мікрофона.', stats:[]}, ctx); return; }
    const inScale = played.filter(p=>pcs.has(pc(p.n))).length/played.length;
    const iois = played.slice(1).map((p,i)=>Math.round((p.t-played[i].t)/r.spbMs*4)/4).filter(x=>x>0 && x<=4);
    const variety = Math.min(1, new Set(iois).size/4), range = Math.max(...played.map(p=>p.n)) - Math.min(...played.map(p=>p.n));
    let chordFit = null;
    if(chordSeq){ let hit=0, tot=0; played.forEach(p=>{ const b = (p.t - r.t0Perf)/r.spbMs; if(Math.abs(b-Math.round(b))>0.2 || Math.round(b)%2) return; let q=0; for(const c of chordSeq){ if(b<q+c.beats){ tot++; if(c.tones.includes(pc(p.n))) hit++; break; } q+=c.beats; } }); chordFit = tot?hit/tot:0; }
    const density = played.length/total;
    let score = inScale*55 + variety*20 + Math.min(1, range/7)*10 + (chordFit==null ? 15 : chordFit*15);
    if(density > 1.6) score -= 10;
    const outs = [...new Set(played.filter(p=>!pcs.has(pc(p.n))).map(p=>pcName(p.n)))];
    const adv = [];
    if(outs.length) adv.push('Ноти поза звукорядом: '+outs.join(', ')+'.');
    if(variety<0.5) adv.push('Ритм одноманітний. Змішуй довгі ноти з короткими.');
    if(density>1.6) adv.push('Майже без пауз. Фраза дихає, коли між нею і наступною є тиша.');
    if(range<5) adv.push('Вузький діапазон, спробуй ширші стрибки.');
    if(chordFit!=null && chordFit<0.5) adv.push('На сильні долі став звуки акорду, що звучить у цей момент.');
    showResult(R, {score, pass:ex.pass||70, advice: adv.join(' ') || 'Мелодично і в стилі.',
      stats:[['нот зіграно', played.length], ['у звукоряді', Math.round(inScale*100)+'%'], ['ритмічна різноманітність', Math.round(variety*100)+'%'], ['діапазон', range+' півтонів'], ...(chordFit!=null?[['звуки акорду на сильних долях', Math.round(chordFit*100)+'%']]:[])]}, ctx);
  }
  return ()=>{ off(); br.off(); stopLoop(); if(run) run.stop(); };
}

const RUNNERS = { notes:runNotes, long:runLong, rhythm:runRhythm, dyn:runDyn, vibrato:runVibrato, echo:runEcho, improv:runImprov };

// ---------- Акорди з MIDI-доріжок ----------
QUAL.m7b5 = [0,3,6,10]; QUAL.dim7 = [0,3,6,9]; QUAL['7sus4'] = [0,5,7,10];
const DETECT_Q = [['maj7',[0,4,7,11]],['7',[0,4,7,10]],['m7',[0,3,7,10]],['m7b5',[0,3,6,10]],['dim7',[0,3,6,9]],['',[0,4,7]],['m',[0,3,7]],['dim',[0,3,6]],['sus4',[0,5,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]]];
const NAMES_SHARP = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
// Визначає акорд у кожному вікні (півтакту в 4/4, такт у 3/4) за доріжками супроводу
function detectChords(tracks, total, beats){
  const harm = (tracks||[]).filter(t=>t.kind !== 'drums' && t.kind !== 'lead');
  if(!harm.length || !total) return null;
  const win = beats === 4 ? 2 : beats, out = [];
  for(let w = 0; w < total - 1e-6; w += win){
    const we = Math.min(total, w + win), wt = new Array(12).fill(0); let low = null, lowN = 999;
    harm.forEach(t=>t.notes.forEach(([n, s, d])=>{ const ov = Math.min(s+d, we) - Math.max(s, w); if(ov <= 0) return;
      const k = t.kind === 'bass' ? 1.6 : 1; wt[pc(n)] += ov * k; if(n < lowN){ lowN = n; low = pc(n); } }));
    const sum = wt.reduce((a,b)=>a+b, 0);
    if(sum < 0.2){ out.push(['N', we - w]); continue; }
    let best = null, bs = -1e9;
    for(let r = 0; r < 12; r++) for(const [q, iv] of DETECT_Q){
      const tones = iv.map(x=>(r+x)%12); let s = 0;
      for(let p = 0; p < 12; p++) s += tones.includes(p) ? wt[p] : -0.6*wt[p];

// ---------- Імпорт MusicXML (.musicxml, .xml, .mxl) ----------
// Перетворює партитуру на ту саму структуру, що й читач MIDI: {tracks:[{name, program, notes:[{n,s,e,v}]}], div, bpm, tsig, chords}
async function readScoreFile(file){
  const name = file.name.toLowerCase();
  if(/\.(mid|midi)$/.test(name)) return readMidiFile(await file.arrayBuffer());
  let xml;
  if(name.endsWith('.mxl')){
    if(!window.JSZip){ for(const src of (DESKTOP ? ['vendor/jszip.min.js'] : []).concat(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'])){ try{ await loadScript(src); if(window.JSZip) break; }catch(e){} } }
    if(!window.JSZip) throw new Error('не вдалося відкрити .mxl');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());

    if(!path) path = Object.keys(zip.files).find(f=>/\.(xml|musicxml)$/i.test(f) && !f.startsWith('META-INF'));

const STEP_PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  const names = {}; doc.querySelectorAll('part-list score-part').forEach(sp=>{ names[sp.getAttribute('id')] = txt(sp, 'part-name') || sp.getAttribute('id'); });
  let bpm = null, tsig = null, harmPart = null; const tracks = [], harmonies = [];

        else if(tag === 'backup'){ t -= (+txt(el, 'duration')||0) * DIV / div; }

        else if(tag === 'harmony' && (harmPart === null || harmPart === pi)){ const st = txt(el, 'root root-step'); if(st){ harmPart = pi; const alt = +txt(el, 'root root-alter') || 0, kind = el.querySelector('kind');

// ---------- Транспонування мінусовки без зміни темпу ----------
// WSOLA: розтягуємо запис у часі в r разів, потім передискретизуємо назад — темп той самий, висота зсунута на k півтонів.
async function pitchShiftBuffer(audio, semis, progress){

  const outLen = Math.ceil(len * r) + N, out = [...Array(chs)].map(()=>new Float32Array(outLen)), norm = new Float32Array(outLen);
  const frames = Math.floor((len - N - tol) / Ha); let prev = 0;
  for(let m = 0; m < frames; m++){

    if(m > 0){ const nat = prev + Hs; let bs = -Infinity;
      for(let d = -tol; d <= tol; d += 8){ const p = nominal + d; if(p < 0 || p + N >= len) continue; let s = 0;
        for(let i = 0; i < Hs; i += 8) s += mono[p+i] * mono[nat+i]; if(s > bs){ bs = s; best = p; } } }

    for(let c=0;c<chs;c++){ const d = src[c], od = out[c]; for(let i=0;i<N;i++) od[o+i] += d[best+i]*win[i]; }

  progress && progress(1); return res;
}

  {type:'long', title:'Верхні довгі ноти', how:'Кожна нота 4 секунди.', seq:'D5 E5 G5', hold:4}],
 mistakes:['Великий палець відривається від роликів, і звук обривається.','Ролик змінюється на мить раніше чи пізніше за пальці, і проскакує нота з іншої октави.'],
 home:'Стрибки {G4} ↔ {G5} повільно, щоб обидві ноти звучали однаково рівно.'},

// ===== Рівень 2 =====
{id:'2.1', lvl:2, title:'Пульс, такт, четвертні й половинні', goal:'Грати точно на долю разом із метрономом.',
 theory:[
  'Пульс це рівні удари, темп рахується в ударах на хвилину (bpm). У розмірі 4/4 у такті чотири долі.',
  'Четвертна нота триває одну долю, половинна дві, ціла чотири. Рахуй про себе «раз-два-три-чотири».',
  'Нота має починатися точно на клацання, а не після нього. Над кожною нотою після спроби застосунок пише відхилення: «+40» означає запізнення на 40 мс, «−30» поспіх. Ціль на цьому етапі ±100 мс.',
  'Перед кожною спробою звучить один такт рахунку. Вдихни на останню долю рахунку.'],
 listen:{seq:'G4:1 G4:1 A4:2 B4:1 B4:1 A4:2', bpm:70, label:'Четвертні й половинні'},
 ex:[
  {type:'rhythm', title:'Четвертні й половинні', how:'Грай разом із метрономом.', seq:'G4:1 G4:1 A4:2 B4:1 B4:1 A4:2 G4:1 A4:1 B4:1 C5:1 B4:4', bpm:70, tol:100},
  {type:'rhythm', title:'Права рука в ритмі', how:'Половинні вниз, четвертні вгору.', seq:'D4:2 E4:2 F4:2 G4:2 A4:1 G4:1 F4:1 E4:1 D4:4', bpm:70, tol:100}],
 mistakes:['Нота починається після клацання: ти реагуєш на метроном замість того, щоб відчувати його наперед.','Половинна обривається раніше: рахуй дві долі до кінця.'],
 home:'Будь-яку вправу на 60 bpm, а потім на 80 bpm.'},

{id:'2.2', lvl:2, title:'Восьмі, паузи, крапка', goal:'Читати восьмі, паузи і ноти з крапкою.',
 theory:[
  'Восьма триває половину долі. Рахунок «раз-і-два-і»: ноти на «раз» падають на клацання, на «і» між клацаннями.',
  'Пауза теж має тривалість, і її теж рахують. На EWI пауза означає просто перестати дути.',
  'Крапка після ноти додає половину її тривалості. Четвертна з крапкою триває півтори долі, і після неї зазвичай іде восьма, яка закриває долю.'],
 listen:{seq:'G4:1.5 A4:0.5 B4:1 r:1 B4:1.5 C5:0.5 D5:2', bpm:72, label:'Крапка і пауза'},
 ex:[
  {type:'rhythm', title:'Восьмі', how:'Рахуй «раз-і-два-і».', seq:'G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5:1 r:1 C5:0.5 B4:0.5 A4:0.5 G4:0.5 A4:2', bpm:72, tol:90},
  {type:'rhythm', title:'Четвертна з крапкою', how:'Довга нота і коротка восьма.', seq:'G4:1.5 A4:0.5 B4:1 r:1 B4:1.5 C5:0.5 D5:2 E5:1 D5:0.5 C5:0.5 B4:1 A4:1 G4:4', bpm:72, tol:90},
  {type:'rhythm', title:'Паузи', how:'Пауза рахується так само точно, як нота.', seq:'D4:0.5 D4:0.5 r:0.5 E4:0.5 F4:1 r:1 G4:0.5 r:0.5 G4:0.5 r:0.5 A4:2', bpm:66, tol:90}],
 mistakes:['Восьма після крапки звучить зарано.','Паузу «з\'їдено»: наступна нота вступає раніше.'],
 home:'Проплескай ритм вправи долонями, а потім зіграй.'},

{id:'2.3', lvl:2, title:'Атака язиком і legato', goal:'Розділяти ноти язиком і зв\'язувати їх legato.',
 theory:[
  'На EWI нота починається, коли тиск перевищує поріг датчика, і закінчується, коли тиск падає. Звідси два способи грати послідовність нот.',
  '**Атака язиком.** Кінчик язика на мить перекриває потік, як у складі «ту» (тверда атака) або «ду» (м\'яка). Кожна нота починається окремо.',
  '**Legato.** Потік не переривається, ноти змінюють тільки пальці. Звук рівний, наче один довгий видих.',
  '**Staccato.** Нота коротка, приблизно половина тривалості, далі тиша. Звук зупиняє язик, а не відпущене дихання.',
  'Застосунок перевіряє артикуляцію за кривою дихання: у legato між нотами не має бути провалу, у staccato між нотами має бути тиша.'],
 listen:{seq:'G4:1 A4:1 B4:1 C5:1 D5:2', bpm:66, label:'Legato'},
 ex:[
  {type:'rhythm', title:'Legato', how:'Один видих на всю фразу, працюють тільки пальці.', seq:'G4:1 A4:1 B4:1 C5:1 D5:2 C5:1 B4:1 A4:1 G4:1 A4:2', bpm:66, artic:'legato', tol:100},
  {type:'rhythm', title:'Staccato', how:'Коротко, «ту» на кожну ноту.', seq:'G4:1 G4:1 A4:1 A4:1 B4:1 B4:1 C5:2 B4:1 A4:1 G4:2', bpm:72, artic:'staccato', tol:90}],
 mistakes:['У legato між нотами провал повітря: ти мимоволі «дихаєш» на кожну ноту.','У staccato ноти довгі: язик зупиняє звук запізно.'],
 home:'Одна гама legato, та сама гама staccato.'},

{id:'2.4', lvl:2, title:'Перша мелодія: Ода до радості', goal:'Зіграти повну мелодію в темпі.',
 theory:[
  'Тема Бетховена належить до суспільного надбання. Вона рухається переважно поступово і збирає все пройдене: ноти лівої руки, {D5} на ролику, четвертні, четвертну з крапкою з восьмою.',
  'Мелодія складається з фраз по чотири такти. Вдих бери в кінці фрази, на довгій ноті.',
  'Порядок роботи: спочатку в своєму темпі, далі з метрономом на 72 bpm зі звуком-підказкою, потім без підказки, і лише тоді піднімай темп авто-темпом.'],
 listen:{seq:ODE, bpm:90, label:'Ода до радості'},
 ex:[
  {type:'notes', title:'Ноти у своєму темпі', how:'Вивчи послідовність без метронома.', seq:ODE.replace(/:\S+/g,'')},
  {type:'rhythm', title:'Ода з метрономом', how:'Спершу зі звуком-підказкою, потім без нього.', seq:ODE, bpm:72, maxBpm:120, tol:90, artic:'legato'}],
 mistakes:['Восьма після {B4} з крапкою звучить зарано.','Немає часу на вдих, бо фраза не закінчена.'],
 home:'Ода тричі поспіль без зупинок.'},

// ===== Рівень 3 =====
{id:'3.1', lvl:3, title:'Альтерації: F♯, B♭, G♯, E♭, C♯', goal:'Опанувати всі хроматичні ноти першої октави.',
 theory:[
  'Дієз піднімає ноту на півтон, бемоль опускає. На EWI кожна альтерація має свою аплікатуру.',
  '{F#4}: вилкова аплікатура, тобто ліва рука повністю і П2, а П1 пропускається. {Bb4}: Л1 і П1, так званий «1 і 1». {G#4}: ліва рука повністю і лівий мізинець. {Eb4}: усі шість пальців і правий мізинець. {C#5}: усі клавіші відкриті.',
  'Аплікатура стандартна саксофонна. Якщо на твоєму EWI якась із цих нот звучить інакше, перевір у меню EWI Solo тип аплікатури.',
  'Хроматична гама рухається півтонами. Вона найкраще тренує точність пальців, бо сусідні ноти часто розрізняються однією клавішею.'],
 callout:'Нові ноти: {F#4}, {Bb4}, {G#4}, {Eb4}, {C#5}.',
 listen:{seq:'D4:0.5 Eb4:0.5 E4:0.5 F4:0.5 F#4:0.5 G4:0.5 G#4:0.5 A4:0.5 Bb4:0.5 B4:0.5 C5:0.5 C#5:0.5 D5:2', bpm:72, label:'Хроматична гама'},
 ex:[
  {type:'notes', title:'Знайомство', how:'Кожна нова нота між сусідами.', seq:'G4 F#4 G4 A4 Bb4 A4 G4 G#4 A4 D4 Eb4 E4 C5 C#5 D5'},
  {type:'notes', title:'Хроматика', how:'Від {D4} до {D5} півтонами.', seq:'D4 Eb4 E4 F4 F#4 G4 G#4 A4 Bb4 B4 C5 C#5 D5'},
  {type:'rhythm', title:'Хроматика в ритмі', how:'Рівні восьмі.', seq:'D4:0.5 Eb4:0.5 E4:0.5 F4:0.5 F#4:0.5 G4:0.5 G#4:0.5 A4:0.5 Bb4:0.5 B4:0.5 C5:0.5 C#5:0.5 D5:2', bpm:66, tol:90, artic:'legato'}],
 mistakes:['На {F#4} ставиш П1 за звичкою і отримуєш {F4}.','На {C#5} палець торкається Л2, і звучить {C5}.'],
 home:'Хроматика вгору і вниз щодня, починаючи з 60 bpm.'},

{id:'3.2', lvl:3, title:'Мажорні гами: G, C, F', goal:'Грати три мажорні гами рівними восьмими.',
 theory:[
  'Мажорна гама будується за формулою тон, тон, півтон, тон, тон, тон, півтон.',
  'G мажор має один дієз, {F#4}. F мажор має один бемоль, {Bb4}. C мажор без знаків, і тут ми граємо його у верхній октаві, від {C5} до {C6}.',
  'Гами дають беглість пальців і вчать «бачити» тональність: коли гама в пальцях, знаки при ключі вже не треба перечитувати.',
  'Грай legato рівними восьмими, а вершину гами не підкреслюй.'],
 listen:{seq:'G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5:0.5 E5:0.5 F#5:0.5 G5:0.5 F#5:0.5 E5:0.5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 G4:1', bpm:80, label:'G мажор'},
 ex:[
  {type:'rhythm', title:'G мажор', how:'Вгору і вниз восьмими.', seq:'G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5:0.5 E5:0.5 F#5:0.5 G5:0.5 F#5:0.5 E5:0.5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 G4:1', bpm:72, maxBpm:140, tol:85, artic:'legato'},
  {type:'rhythm', title:'F мажор', how:'Не забудь {Bb4}.', seq:'F4:0.5 G4:0.5 A4:0.5 Bb4:0.5 C5:0.5 D5:0.5 E5:0.5 F5:0.5 E5:0.5 D5:0.5 C5:0.5 Bb4:0.5 A4:0.5 G4:0.5 F4:1', bpm:72, maxBpm:140, tol:85, artic:'legato'},
  {type:'rhythm', title:'C мажор, верхня октава', how:'Уся гама на ролику вище.', seq:'C5:0.5 D5:0.5 E5:0.5 F5:0.5 G5:0.5 A5:0.5 B5:0.5 C6:0.5 B5:0.5 A5:0.5 G5:0.5 F5:0.5 E5:0.5 D5:0.5 C5:1', bpm:72, maxBpm:140, tol:85, artic:'legato'}],
 mistakes:['Верхня частина поспішає: пальці «біжуть» до вершини.','На {C5} → {D5} проскакує нижня октава, бо ролик перемикається пізніше за пальці.'],
 home:'Кожна гама з авто-темпом, поки не досягнеш 100 bpm.'},

{id:'3.3', lvl:3, title:'Динаміка', goal:'Керувати гучністю плавно і передбачувано.',
 theory:[
  'Динаміка позначається італійськими словами: pp (дуже тихо), p, mp, mf, f, ff (дуже гучно). Crescendo означає поступове посилення, diminuendo поступове стишення.',
  'На EWI гучністю керує лише тиск повітря. На більшості пресетів разом із гучністю змінюється й тембр: тихий звук темніший.',
  'Найпоширеніша помилка: гучність тримається, а змінюється стрибком наприкінці. Розподіли зміну на всі долі. Пунктир на графіку показує цільову криву.',
  'Тиха гра вимагає більше контролю, ніж гучна, тому тренуй обидва краї діапазону.'],
 ex:[
  {type:'dyn', title:'Crescendo', how:'Від тихого до гучного за 8 доль на {G4}.', note:'G4', shape:'cresc', beats:8, bpm:60},
  {type:'dyn', title:'Diminuendo', how:'Від гучного до тихого на {A4}.', note:'A4', shape:'dim', beats:8, bpm:60},
  {type:'dyn', title:'Хвиля', how:'Посилюй до середини, потім стишуй, на {B4}.', note:'B4', shape:'swell', beats:8, bpm:60},
  {type:'dyn', title:'Сходинки', how:'Чотири рівні гучності на {D5}, по дві долі кожен.', note:'D5', shape:'terrace', beats:8, bpm:60}],
 mistakes:['Зміна відбувається за одну секунду наприкінці.','На diminuendo звук обривається раніше часу.'],
 home:'Хвиля на кожній ноті гами G мажор.'},

{id:'3.4', lvl:3, title:'Розмір 3/4: Amazing Grace', goal:'Грати мелодію з затактом у розмірі 3/4.',
 theory:[
  'У розмірі 3/4 у такті три долі, найсильніша перша. Рахуй «раз-два-три».',
  'Мелодія традиційна, суспільне надбання. Вона починається з затакту: {D4} звучить на третю долю перед першим повним тактом. У вправі перед затактом стоять дві долі паузи.',
  'Тут уперше трапляються стрибки на сексту: {D4} → {B4}. Пальці правої руки знімаються одночасно.'],
 listen:{seq:GRACE, bpm:80, label:'Amazing Grace'},
 ex:[
  {type:'notes', title:'Ноти у своєму темпі', how:'Вивчи послідовність без метронома.', seq:GRACE.replace(/r:\S+/g,'').replace(/:\S+/g,'')},
  {type:'rhythm', title:'Amazing Grace у 3/4', how:'Відчувай першу долю кожного такту.', seq:GRACE, beats:3, bpm:72, maxBpm:110, tol:90, artic:'legato'}],
 mistakes:['Затакт звучить як сильна доля.','Довгі ноти по три долі обриваються раніше.'],
 home:'Запиши дубль кнопкою «Запис» і послухай наступного дня.'},

// ===== Рівень 4 =====
{id:'4.1', lvl:4, title:'Мінор і лади', goal:'Розуміти й грати натуральний, гармонічний мінор і дорійський лад.',
 theory:[
  'Натуральний мінор: тон, півтон, тон, тон, півтон, тон, тон. E мінор має ті самі знаки, що й G мажор, бо це паралельні тональності.',
  'Гармонічний мінор має підвищений сьомий ступінь. В E мінорі це D♯, який грається так само, як {Eb5}. Через нього в гамі з\'являється характерний «східний» півторатоновий стрибок.',
  'Лади отримують із мажорної гами, починаючи з іншої ноти. Дорійський лад: від D по білих нотах. Від натурального мінору його відрізняє велика секста ({B4} у D дорійському), і саме ця нота дає йому джазовий, «світлий» мінорний колір.'],
 listen:{seq:'E4:0.5 F#4:0.5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D#5:0.5 E5:2', bpm:80, label:'E гармонічний мінор'},
 ex:[
  {type:'rhythm', title:'E натуральний мінор', how:'Вгору і вниз восьмими.', seq:'E4:0.5 F#4:0.5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5:0.5 E5:0.5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 G4:0.5 F#4:0.5 E4:1', bpm:80, maxBpm:150, tol:80, artic:'legato'},
  {type:'rhythm', title:'E гармонічний мінор', how:'Слухай стрибок між {C5} і D♯.', seq:'E4:0.5 F#4:0.5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D#5:0.5 E5:0.5 D#5:0.5 C5:0.5 B4:0.5 A4:0.5 G4:0.5 F#4:0.5 E4:1', bpm:76, maxBpm:150, tol:80, artic:'legato'},
  {type:'rhythm', title:'D дорійський', how:'Від {D4} до {D5} без знаків.', seq:'D4:0.5 E4:0.5 F4:0.5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 G4:0.5 F4:0.5 E4:0.5 D4:1', bpm:80, maxBpm:150, tol:80, artic:'legato'}],
 mistakes:['У гармонічному мінорі граєш {D5} замість D♯.','Плутаєш {F4} і {F#4} після G мажору.'],
 home:'Зіграй кожну гаму, а потім заспівай її.'},

{id:'4.2', lvl:4, title:'Інтервали і гра на слух', goal:'Повторювати почуте без нот.',
 theory:[
  'Інтервал це відстань між двома нотами. Мала секунда 1 півтон, велика секунда 2, мала терція 3, велика терція 4, кварта 5, квінта 7, октава 12.',
  'Слухова пам\'ять тренується так: послухай фразу, заспівай її про себе, визнач напрям руху і розмір стрибків, і лише тоді грай.',
  'У цій вправі застосунок грає фразу, а ти повторюєш. Ноти з клавішами з\'являються після відповіді, щоб ти міг звірити.'],
 ex:[
  {type:'echo', title:'Короткі фрази', how:'Три-чотири ноти, лише поступовий рух і терції.', bpm:80, phrases:['G4:1 A4:1 B4:2','B4:1 A4:1 G4:2','G4:1 B4:1 D5:2','D5:1 B4:1 G4:2','G4:1 C5:1 B4:1 A4:1']},
  {type:'echo', title:'Ширші стрибки', how:'Кварти, квінти, альтерації.', bpm:80, phrases:['D4:0.5 F#4:0.5 A4:1 G4:2','E4:1 G4:1 B4:1 A4:1','B4:0.5 C5:0.5 D5:1 G4:2','A4:1 F#4:1 D4:2','G4:1 D5:1 C5:1 B4:1']}],

// перші N долей послідовності
function cutSeq(seq, beats){ let s = 0; const out = []; for(const tok of seq.trim().split(/\s+/)){ if(s >= beats - 1e-6) break; out.push(tok); s += parseDur(tok.split(':')[1]||'1'); } return out.join(' '); }
const FLATS = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'], SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function transSeq(seq, k, flats){ return seq.trim().split(/\s+/).map(tok=>{ const [s,d] = tok.split(':'); if(s==='r') return tok; const n = parseNote(s).midi + k;
  return (flats?FLATS:SHARPS)[pc(n)] + (Math.floor(n/12)-1) + (d!=null?':'+d:''); }).join(' '); }
function transChords(str, k, flats){ return str.trim().split(/\s+/).map(tok=>{ const [nm,d] = tok.split(':'); if(nm==='N') return tok;
  const m = /^([A-G])([#b]?)(.*)$/.exec(nm); const r = (ROOT[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0) + k + 24) % 12; return (flats?FLATS:SHARPS)[r] + m[3] + ':' + d; }).join(' '); }
const noDur = seq => seq.split(/\s+/).filter(t=>!t.startsWith('r')).map(t=>t.split(':')[0]).join(' ');
const song = id => SONGS.find(s=>s.id===id);

{id:'3.6', lvl:3, title:'Синкопи', goal:'Грати акценти між долями, не втрачаючи пульсу.',
 theory:[
  '**Що таке синкопа.** Синкопа це наголос на слабкій частці долі, коли нота починається на «і» і триває через наступну долю. Від цього ритм ніби «спотикається вперед». Синкопи є основою поп-музики, джазу, фанку, латини.',
  '**Як не загубити долю.** Під час синкопи на сильну долю нічого не відбувається: нота вже звучить або там пауза. Через це новачки втрачають пульс. Допомагає фонограма: бочка і малий барабан тримають долі, а ти граєш між ними.',
  '**Випередження (anticipation).** Нота, яка мала б прозвучати на першу долю такту, грається на «і» попереднього. Цей прийом робить мелодію живою, і в поп-музиці він трапляється майже в кожній пісні.',
  '**Артикуляція синкоп.** Синкопована нота починається з чіткої атаки язиком і трохи акцентується диханням. Після неї коротка нота або пауза дає ритму повітря.',
  '**Метод вивчення.** Спочатку проплескай ритм, рахуючи «раз-і-два-і» вголос. Потім зіграй на одній ноті. Лише потім з мелодією.'],
 callout:'Рахуй вголос усі «і»: синкопа завжди починається на одному з них.',
 listen:{seq:'G4:0.5 B4:1 D5:0.5 r:0.5 D5:1 B4:0.5 A4:0.5 C5:1 E5:0.5 r:0.5 E5:1 C5:0.5', bpm:84, label:'Синкопи', chords:'G:4 Am:4', style:'pop'},
 ex:[
  {type:'rhythm', title:'Синкопи на акордах', how:'Нота на «і» триває через долю.', seq:'G4:0.5 B4:1 D5:0.5 r:0.5 D5:1 B4:0.5 A4:0.5 C5:1 E5:0.5 r:0.5 E5:1 C5:0.5 G4:0.5 B4:1 D5:0.5 E5:1 D5:1 B4:4', chords:'G:4 Am:4 G:4 G:4', style:'pop', bpm:80, maxBpm:120, tol:80, pass:72},
  {type:'rhythm', title:'Випередження', how:'Фрази починаються на «і» після паузи.', seq:'r:0.5 G4:0.5 A4:0.5 B4:1 G4:1.5 r:0.5 A4:0.5 B4:0.5 C5:1 A4:1.5 r:0.5 B4:0.5 C5:0.5 D5:1.5 B4:1 G4:4', chords:'G:4 Am:4 G:4 G:4', style:'pop', bpm:84, maxBpm:124, tol:80, pass:72}],

 plan:['3 хв: довгі ноти.','3 хв: проплескати обидва ритми з рахунком вголос.','5 хв: «Синкопи на акордах».','4 хв: «Випередження».'],
 home:'Візьми «Оду до радості» і зіграй кожну першу ноту фрази на «і» попереднього такту.'},

{id:'4.5', lvl:4, title:'Пентатоніки', goal:'Вивчити мажорну й мінорну пентатоніку та зіграти на них першу фразу.',
 theory:[
  '**П\'ять нот.** Пентатоніка це гама з п\'яти нот без півтонів. Мажорна будується з 1, 2, 3, 5, 6 ступенів мажору: в G це {G4}, {A4}, {B4}, {D5}, {E5}. Мінорна з 1, ♭3, 4, 5, ♭7: в E це {E4}, {G4}, {A4}, {B4}, {D5}.',
  '**Одна гама, два обличчя.** G мажорна і E мінорна пентатоніки складаються з тих самих нот, відрізняється лише центр. Це паралельні пентатоніки, так само як G мажор і E мінор.',
  '**Чому вона така популярна.** Без півтонів у пентатоніці немає різких дисонансів, тому майже будь-яка послідовність її нот звучить мелодійно над відповідним акордом. Нею користуються в народній музиці від Китаю до Шотландії, в блюзі, року, поп-музиці. Додай до мінорної пентатоніки ♭5, і отримаєш блюзову гаму з п\'ятого рівня.',
  '**Для EWI** пентатоніка зручна: багато нот з простими аплікатурами. Важкі місця тільки переходи через ролик {B4} → {D5} і {E5} → {G5}.',
  '**Як імпровізувати.** Почни з трьох нот пентатоніки, грай короткі мотиви з паузами, поступово додавай решту нот. Закінчуй фрази на тоніці або на квінті.'],
 callout:'G мажорна і E мінорна пентатоніки: ті самі п\'ять нот, різний центр.',
 listen:{seq:'G4:0.5 A4:0.5 B4:0.5 D5:0.5 E5:0.5 G5:0.5 A5:0.5 B5:0.5 A5:0.5 G5:0.5 E5:0.5 D5:0.5 B4:0.5 A4:0.5 G4:1', bpm:84, label:'G мажорна пентатоніка', chords:'G:4 G:4', style:'folk'},

  {type:'improv', title:'Імпровізація на мінорній пентатоніці', how:'8 тактів над бурдоном E. Тільки п\'ять нот і паузи.', bpm:84, bars:8, drone:'E3', scaleSeq:'E4 G4 A4 B4 D5 E5 G5', pass:68}],
